<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>たくわえ 支出分析検証</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae0;color:#283e48;font:16px system-ui}main{max-width:440px;margin:auto;padding:16px}h1{font-size:22px}section{background:#fffdf5;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #0001}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.metric{flex:1}small{display:block;color:#59636a}strong{font-size:22px}button{font:inherit;border:0;border-radius:24px;padding:12px;background:#e5e2d8;color:#243e50;flex:1}button[aria-pressed=true]{background:#326fa5;color:white}.bar{height:8px;background:#eae6dd;border-radius:8px;margin:5px 0 14px}.bar i{display:block;height:100%;border-radius:8px}.legend{display:grid;gap:9px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}svg{display:block;width:100%;max-width:290px;margin:10px auto}summary{cursor:pointer}p{font-size:13px;line-height:1.6}nav{background:#10263c;color:white;padding:15px;text-align:center;border-radius:12px}</style><main><h1>たくわえ｜資産状況</h1><small>独立検証版・架空データのみ（保存・同期なし）</small><section class="row"><div class="metric"><small>可処分資産合計</small><strong style="color:#008d88">¥50,000</strong></div><div class="metric"><small>積立残高合計</small><strong>¥120,000</strong></div></section><section><details open><summary>支出合計 <b style="float:right;color:#b33">¥30,000</b></summary><p>12月分　11/25〜12/24</p><div class="row"><button id="bar" aria-pressed="true">棒グラフ</button><button id="pie" aria-pressed="false">円グラフ</button></div><div id="view" style="margin-top:18px"></div></details></section><nav>ホーム　　記録　　資産　　設定</nav></main><script>const expenses=[['食費',12000,'#82998b'],['買い物',8000,'#b6a17e'],['外食費',5000,'#8d9caf'],['飲料',3000,'#ad9290'],['雑費',2000,'#aaa69c']];const yen=n=>'¥'+n.toLocaleString('ja-JP');function show(p){bar.setAttribute('aria-pressed',!p);pie.setAttribute('aria-pressed',p);if(!p){view.innerHTML=expenses.map(([n,v,c])=>'<div class="row"><span>'+n+'</span><b>'+yen(v)+'</b></div><div class="bar"><i style="width:'+v/300+'%;background:'+c+'"></i></div>').join('');return}const rows=[...expenses,['当月積立',20000,'#d6aa52'],['残りの可処分資産',50000,'#21b8ad']];let offset=0;let arcs=rows.map(([n,v,c])=>{let pct=v/1000;let a='<circle cx="100" cy="100" r="72" fill="none" stroke="'+c+'" stroke-width="38" pathLength="100" stroke-dasharray="'+pct+' '+(100-pct)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 100 100)"/>';offset+=pct;return a}).join('');view.innerHTML='<svg viewBox="0 0 200 200" role="img" aria-label="残り50%、当月積立20%、支出30%">'+arcs+'<text x="100" y="94" text-anchor="middle" font-size="12" fill="#008d88">あと使える割合</text><text x="100" y="119" text-anchor="middle" font-size="27" font-weight="bold" fill="#008d88">50%</text></svg><div class="legend">'+rows.map(([n,v,c])=>'<div class="row"><span><i class="dot" style="background:'+c+'"></i>'+n+'</span><b>'+v/1000+'%</b></div>').join('')+'</div><p>集計対象：当月支出＋当月積立＋現在の可処分資産。過去の積立残高は円グラフに含めません。</p>'}bar.onclick=()=>show(false);pie.onclick=()=>show(true);show(false)</script></html>
