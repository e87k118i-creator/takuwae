<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>たくわえ｜2端末の同期シミュレーター</title>
<style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,sans-serif;margin:0;padding:24px;color:#17374c;background:#edf3f5}main{max-width:1050px;margin:auto}h1{font-size:1.6rem}h2{font-size:1.2rem}p{margin:8px 0 16px}.notice,article{background:#fff;border:1px solid #c9dbe3;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}button,input{font:inherit;min-height:44px;border-radius:8px;padding:8px 12px}button{background:#255f7b;color:white;border:0;cursor:pointer;margin:4px}button:disabled{opacity:.5;cursor:wait}input{border:1px solid #91acba;max-width:150px}label{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,monospace;max-height:280px;overflow:auto}strong{color:#114967}.status{padding:10px;background:#e6f0f5;border-radius:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:14px}}</style>
</head><body><main>
<h1>たくわえ｜2端末の同期シミュレーター</h1>
<div class="notice"><strong>架空データだけの検証画面</strong><p>メール認証・Supabase通信・本番データの読み込みは行いません。データはこのページのメモリー内だけにあり、再読み込みで消えます。</p>
<p>両端末で別々に記録を追加し、A→B→Aの順に同期すると、両方の記録が残ります。同じ「予備枠」を別々の金額に変えると競合して停止します。</p></div>
<div id="devices" class="grid"></div>
<article><h2>架空サーバーの状態</h2><pre id="server"></pre></article>
<p id="global-status" role="status">検証環境を準備しています。</p>
</main><script type="module" src="./supabase/sync-simulator.js"></script></body></html>
