.nav-inner button .piggy-nav{width:31px;height:31px;border-radius:11px;background:#ffe0ec;box-shadow:inset 0 0 0 1px #ffffff78,0 1px 2px #061f302a}
.nav-inner button .piggy-face{font-size:24px}
.nav-inner button .piggy-coin{right:-3px;top:-3px}

/* v25: real full-color emoji pictograms, not tinted line drawings. */
.nav-inner .emoji-nav{
 display:inline-flex;align-items:center;justify-content:center;
 width:31px;height:31px;flex:none;border-radius:11px;
 font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
 font-size:24px;font-weight:400;line-height:1;
 background:#fff6e7;box-shadow:inset 0 0 0 1px #ffffff80,0 1px 2px #061f302a;
}
.nav-inner .emoji-home{background:#e1f3e6}
.nav-inner .emoji-entry{background:#e3edfa}
.nav-inner .emoji-bills{background:#fff0d6}
.nav-inner .emoji-history{background:#eee6fb}
.nav-inner .emoji-settings{background:#e2eff2}
.nav-inner button.active .emoji-nav,.nav-inner button.active .piggy-nav{filter:brightness(1.06);transform:translateY(-1px)}

/* Approved B: vivid red/blue cashflow arrows and gold yen coin. */
.nav-inner .entry-money-icon{width:34px;height:34px;object-fit:contain;display:block;border-radius:9px;flex:none}
.nav-inner button.active .entry-money-icon{filter:brightness(1.08);transform:translateY(-1px)}

/* v27: clear selected tab using a softly lit floating tile. */
.nav-inner{align-items:center}
.nav-inner button{
 position:relative;transform-origin:center bottom;
 transition:transform 170ms ease, background-color 170ms ease, box-shadow 170ms ease;
}
.nav-inner button.active{
 background:linear-gradient(180deg,rgba(255,251,231,.25),rgba(240,230,198,.13));
 color:#ffe184;
 border-radius:13px;
 box-shadow:0 0 0 1px rgba(255,245,209,.32),0 4px 10px rgba(0,12,22,.25);
 transform:translateY(-2px) scale(1.055);
 z-index:1;
}
.nav-inner button.active .nav-label{color:#ffe184}
@media(prefers-reduced-motion:reduce){.nav-inner button{transition:none}}

/* v28: gently mute only the five unselected tabs, preserving full-color artwork. */
.nav-inner button:not(.active) .nav-icon,
.nav-inner button:not(.active) .emoji-nav,
.nav-inner button:not(.active) .piggy-nav,
.nav-inner button:not(.active) .entry-money-icon{
 filter:saturate(.68) brightness(.88);
 opacity:.88;
 transition:filter 170ms ease,opacity 170ms ease;
}
.nav-inner button:not(.active) .nav-label{color:#b9c9d2;transition:color 170ms ease}
.nav-inner button.active .nav-icon,
.nav-inner button.active .emoji-nav,
.nav-inner button.active .piggy-nav,
.nav-inner button.active .entry-money-icon{opacity:1}
@media(prefers-reduced-motion:reduce){
 .nav-inner button:not(.active) .nav-icon,
 .nav-inner button:not(.active) .emoji-nav,
 .nav-inner button:not(.active) .piggy-nav,
 .nav-inner button:not(.active) .entry-money-icon{transition:none}
}

/* v30 six softly dimensional tab illustrations: icon-only, no background panels. */
.nav-inner .nav-illustration{display:block;flex:none;width:42px;height:42px;max-width:100%;overflow:visible;filter:drop-shadow(0 2px 1px rgba(0,10,25,.28));transition:filter 170ms ease}
.nav-inner button{gap:1px;padding-top:5px;padding-bottom:6px;min-height:65px}
.nav-inner button:not(.active) .nav-illustration{filter:saturate(.68) brightness(.88) drop-shadow(0 1px 1px rgba(0,10,25,.18));opacity:.88}
.nav-inner button.active .nav-illustration{filter:drop-shadow(0 3px 2px rgba(0,10,25,.3));opacity:1}
.nav-inner button .nav-label{font-size:13px}
@media(max-width:390px){.nav-inner .nav-illustration{width:37px;height:37px}.nav-inner button .nav-label{font-size:12px}}
@media(prefers-reduced-motion:reduce){.nav-inner .nav-illustration{transition:none}}

/* v35: slightly larger, lighter labels; preserve selected state and icon layout. */
.nav-inner button .nav-label{font-size:14px;font-weight:550;letter-spacing:0;line-height:1.2}
.nav-inner button.active .nav-label{font-weight:650}
@media(max-width:390px){.nav-inner button .nav-label{font-size:13px}}

header.washi-header{
 position:relative;
 min-height:126px;
 margin:0 0 18px;
 padding:26px 38px 20px;
 border:0;
 border-bottom:1px solid rgba(132,110,80,.20);
 display:flex;align-items:center;justify-content:center;
 text-align:center;
 background:linear-gradient(180deg,rgba(255,252,245,.60),rgba(255,250,240,.13));
}
header.washi-header:before{
 content:"";
 position:absolute;
 left:-14px;top:16px;bottom:18px;width:34px;
 background-image:
  radial-gradient(ellipse 15px 10px at 17px 9px,transparent 55%,#8d7858 59%,#e3c68c 68%,#786342 73%,transparent 80%),
  radial-gradient(ellipse 15px 10px at 17px 48px,transparent 55%,#8d7858 59%,#e3c68c 68%,#786342 73%,transparent 80%),
  radial-gradient(ellipse 15px 10px at 17px 87px,transparent 55%,#8d7858 59%,#e3c68c 68%,#786342 73%,transparent 80%);
 background-repeat:no-repeat;
 background-size:34px 22px,34px 22px,34px 22px;
 background-position:0 0,0 39px,0 78px;
 opacity:.94;
}
header.washi-header:after{
 content:"✒";
 right:2px;top:52px;
 font-size:31px;color:#9b6b35;
 transform:rotate(-26deg);
 opacity:.92;
}
header.washi-header h1{
 font-size:clamp(29px,calc(7.3vw + 2px),39px);
 letter-spacing:.12em;font-weight:750;
 color:#142d49;text-shadow:0 1px 0 #fff9;
 white-space:nowrap;
}
header.washi-header h1:before{content:"🌱";font-size:.66em;vertical-align:3px;margin-right:8px;letter-spacing:0}
header.washi-header small{
 display:block;margin-top:7px;font-size:clamp(13px,calc(3vw + 2px),16px);
 font-weight:500;letter-spacing:.055em;color:#334151;
}
header.washi-header .pill{position:absolute;right:0;bottom:-12px;z-index:1}
@media(max-width:390px){
 header.washi-header{min-height:117px;padding:23px 21px 20px}
 header.washi-header:after{right:-2px;font-size:25px}
}

/* v42 — soft dimensional cards on cream felt, visual-only overrides. */
#view .card,
#view .hero{
  background:linear-gradient(155deg,#fffefb 0%,#fffcf6 47%,#f7f0e5 100%);
  border:1px solid #e6dacc;
  border-radius:20px;
  box-shadow:
    0 3px 0 rgba(203,187,166,.83),
    0 6px 9px rgba(83,65,45,.12),
    0 13px 22px rgba(68,53,40,.075),
    inset 0 1px 0 rgba(255,255,255,.96);
}
#view .hero{
  box-shadow:
    0 4px 0 rgba(194,177,155,.92),
    0 8px 13px rgba(77,60,42,.16),
    0 17px 28px rgba(77,60,42,.095),
    inset 0 1px 0 #fff;
}
#view .grid>.card{
  box-shadow:
    0 2px 0 rgba(209,194,174,.84),
    0 5px 9px rgba(83,65,45,.11),
    0 10px 18px rgba(68,53,40,.06),
    inset 0 1px 0 rgba(255,255,255,.92);
}

/* v45: replace oversized native iOS month picker with bounded month navigation. */
#view .bill-month-field{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
#view .bill-month-nav{
 display:grid;
 grid-template-columns:42px minmax(0,1fr) 42px;
 align-items:center;
 gap:8px;
 width:100%;
 min-width:0;
 max-width:100%;
 padding:5px;
 background:#fffdf8;
 border:1px solid #d6c9b7;
 border-radius:13px;
 box-sizing:border-box;
}
#view .bill-month-nav button{
 display:flex;align-items:center;justify-content:center;
 width:42px;height:44px;min-width:0;
 margin:0;padding:0;
 font-size:27px;line-height:1;font-weight:500;
 background:linear-gradient(#f8f3ea,#ece3d6);
 color:#25445c;
 box-shadow:0 2px 3px rgba(72,57,41,.10);
}
#view .bill-month-value{
 display:block;min-width:0;
 text-align:center;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;
 font-weight:750;font-size:clamp(16px,calc(4vw + 2px),19px);color:#29435b;
}

/* v49: whisper-light pale aqua tint on existing milk-glass cards; preserve transparency and shadows. */
#view .card,
#view .hero{
  background:linear-gradient(150deg,rgba(250,253,255,.81) 0%,rgba(247,252,255,.75) 55%,rgba(246,250,253,.71) 100%);
  border:1px solid rgba(255,255,255,.87);
  border-radius:20px;
  -webkit-backdrop-filter:blur(12px) saturate(112%);
  backdrop-filter:blur(12px) saturate(112%);
  box-shadow:0 4px 10px rgba(83,72,61,.14),0 11px 22px rgba(83,72,61,.065),inset 0 1px 0 rgba(255,255,255,.94);

body{overflow-x:hidden} .testbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.testbar button{font-size:13px}.testnote{font-size:12px;color:#69788a}.entry{padding:8px 0}.home-expense-details svg{max-width:100%!important;height:auto}#home-expense-breakdown{min-width:0} </style><main><header><h1>たくわえ</h1><small>検証専用</small></header><div class="testnote">実画面のスタイルを使ったサンプル。実データ・同期なし。</div><div class="testbar"><button onclick="show(4)">通常4項目</button><button onclick="show(11)">11項目</button><button onclick="show(15)">16区分</button></div><div class="hero"><small>一日に使える目安</small><div class="big">¥1,000</div></div><div class="card"><h3>資金状況</h3><div class="row entry"><b>可処分資産合計</b><b>¥10,000</b></div><div class="row entry"><span>りそな</span><strong>¥8,000</strong></div><div class="row entry"><span>財布</span><strong>¥2,000</strong></div><div class="row entry"><span>帳簿上の資産合計</span><strong>¥30,000</strong></div><div class="home-expense-details"><button style="display:flex;align-items:center;width:100%;background:transparent;color:inherit;box-shadow:none;padding:8px 0" onclick="document.getElementById('home-expense-breakdown').toggleAttribute('hidden')"><span style="flex:1;text-align:left">支出合計</span><span id="total" style="color:#c62828"></span>　⌄</button><div id="home-expense-breakdown" style="border-top:1px solid #ddd;padding-top:10px"></div></div></div><div class="card"><h3>積立状況</h3><div class="row"><span>車用積立</span><b>¥20,000</b></div></div></main><script>let free=10000;const balances=()=>({r:free}),fixedUnpaid=()=>0,unpaidCredit=()=>0,db={},fmt=n=>'¥'+n.toLocaleString('ja-JP'),esc=s=>String(s);function raisedExpensePie(rows,colors){
 const bal=balances(),free=Math.max(0,['r','cash','em'].reduce((s,k)=>s+(Number(bal[k])||0)-fixedUnpaid(k)-unpaidCredit(k),0)-(Number(db.weeklyBuffer)||0));
 const valid=[...rows.filter(x=>Number(x[1])>0),...(free>0?[['残り資産',free]]:[])],sum=valid.reduce((s,x)=>s+Number(x[1]),0);if(!sum)return '';
 const R=83,I=48,H=12,cy=90,cx=150,sy=.72,pt=(r,a,h=0)=>[cx+r*Math.cos(a),cy+sy*r*Math.sin(a)+h].map(v=>v.toFixed(3)).join(' '),arc=(r,a,b,h=0,rev=false)=>'A'+r+' '+r*sy+' 0 '+(Math.abs(b-a)>Math.PI?1:0)+' '+(rev?0:1)+' '+pt(r,b,h);
 let angle=-Math.PI/2,defs='',walls=[],tops=[],labels=[];
 valid.forEach(([name,value],i)=>{const span=Number(value)/sum*Math.PI*2,gap=valid.length===1?0:Math.min(.025,span*.10),a=angle+gap,b=angle+span-gap,m=(a+b)/2;angle+=span;const color=name==='残り資産'&&i===valid.length-1&&free>0?'#18c64b':colors.filter(x=>x!=='#25b985')[i% (colors.length-1)],id='satin-pie-'+i;
 defs+='<linearGradient id="'+id+'" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="'+color+'"/><stop offset=".28" stop-color="'+color+'"/><stop offset="1" stop-color="'+color+'"/></linearGradient>';
 const face=(d,shade)=>'<path d="'+d+'" fill="'+color+'" style="filter:brightness('+shade+')"/>';
 const q=Math.min(4,(R-I)/4,I*(b-a)/5),ro=q/R,ri=q/I;
 const full=valid.length===1;
 const d=full?'M'+pt(R,a)+' '+arc(R,a,a+Math.PI)+' '+arc(R,a+Math.PI,b)+' L'+pt(I,b)+' '+arc(I,b,b-Math.PI,0,true)+' '+arc(I,b-Math.PI,a,0,true)+' Z':'M'+pt(R,a+ro)+' '+arc(R,a+ro,b-ro)+' Q'+pt(R,b)+' '+pt(R-q,b)+' L'+pt(I+q,b)+' Q'+pt(I,b)+' '+pt(I,b-ri)+' '+arc(I,b-ri,a+ri,0,true)+' Q'+pt(I,a)+' '+pt(I+q,a)+' L'+pt(R-q,a)+' Q'+pt(R,a)+' '+pt(R,a+ro)+' Z';
 // Extrude the exact rounded top contour, including every corner.
 const P=(r,t)=>[r*Math.cos(t),r*Math.sin(t)];
 const contour=[];
 const add=p=>contour.push(p);
 const curve=(p0,p1,p2)=>{for(let j=1;j<=8;j++){const t=j/8,u=1-t;add([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]])}};
 const ring=(r,u,v)=>{const n=Math.max(1,Math.ceil(Math.abs(v-u)/.035));for(let j=0;j<=n;j++)add(P(r,u+(v-u)*j/n))};
 const loops=[];
 if(full){ring(R,a,b);loops.push(contour.splice(0));ring(I,b,a);loops.push(contour.splice(0));}
 else {ring(R,a+ro,b-ro);curve(P(R,b-ro),P(R,b),P(R-q,b));add(P(I+q,b));curve(P(I+q,b),P(I,b),P(I,b-ri));ring(I,b-ri,a+ri);curve(P(I,a+ri),P(I,a),P(I+q,a));add(P(R-q,a));curve(P(R-q,a),P(R,a),P(R,a+ro));loops.push(contour);}
 const project=(p,h=0)=>[cx+p[0],cy+sy*p[1]+h].map(v=>v.toFixed(3)).join(' ');
 for(const loop of loops){for(let j=0;j<loop.length;j++){const p=loop[j],n=loop[(j+1)%loop.length],dx=n[0]-p[0],dy=n[1]-p[1],len=Math.hypot(dx,dy);if(len<.001||dx>=0)continue;
 const shade=.73+.16*Math.max(0,-dy/len)+.08*Math.abs(dx/len);
 const poly='M'+project(p)+' L'+project(n)+' L'+project(n,H)+' L'+project(p,H)+' Z';
 walls.push({z:(p[1]+n[1])/2,html:'<path d="'+poly+'" fill="'+color+'" stroke="'+color+'" stroke-width=".35" style="filter:brightness('+shade+')"/>'});
 }}
 tops.push('<path d="'+d+'" fill="'+color+'"/><path d="'+d+'" fill="url(#satin-donut-light)" pointer-events="none"/>');
 const side=Math.cos(m)>=0?1:-1;labels.push({side,y:cy+Math.sin(m)*65,m,name,value,color});
 });
 const maxSide=Math.max(...[-1,1].map(side=>labels.filter(x=>x.side===side).length)),height=Math.max(210, maxSide*49+32),offset=(height-190)/2;
 let lab='';for(const side of [-1,1]){const list=labels.filter(x=>x.side===side).sort((a,b)=>a.y-b.y);let prev=0;for(const x of list){x.ly=Math.max(x.y+offset,prev+49);prev=x.ly;}const shift=Math.max(0,prev-height+18);for(const x of list){const y=x.ly-shift,tx=side===1?336:4,ex=side===1?270:70;const name=Array.from(x.name);const lines=name.length>5?[name.slice(0,5).join(''),name.slice(5,10).join('')+(name.length>10?'…':'')]:[x.name];lab+='<path d="M'+(170+R*Math.cos(x.m))+' '+(cy+offset+sy*R*Math.sin(x.m))+' L'+ex+' '+y+' H'+(side===1?274:66)+'" fill="none" stroke="currentColor" opacity=".5" stroke-width=".8"/>'+lines.map((line,j)=>{const yy=y-7-(lines.length-1-j)*15,w=Array.from(line).length*13;return '<rect x="'+(side===1?tx-w:tx)+'" y="'+(yy-7)+'" width="'+w+'" height="8" rx="3" fill="'+x.color+'" opacity=".36"/><text x="'+tx+'" y="'+yy+'" text-anchor="'+(side===1?'end':'start')+'" font-size="13" font-weight="600" fill="currentColor">'+esc(line)+'</text>'}).join('')+'<text x="'+tx+'" y="'+(y+10)+'" text-anchor="'+(side===1?'end':'start')+'" font-size="15" font-weight="700" fill="currentColor">'+(Number(x.value)/sum*100).toFixed(1).replace(/\\.0$/,'')+'%</text>';}}
 return '<svg viewBox="0 0 340 '+height+'" role="img" aria-label="立体ドーナツ型支出内訳" style="display:block;width:100%;max-width:360px;margin:8px auto 14px;overflow:visible"><defs><radialGradient id="satin-donut-light" gradientUnits="userSpaceOnUse" cx="112" cy="40" r="145"><stop stop-color="white" stop-opacity=".85"/><stop offset=".16" stop-color="white" stop-opacity=".65"/><stop offset=".35" stop-color="white" stop-opacity=".27"/><stop offset=".58" stop-color="white" stop-opacity="0"/><stop offset=".8" stop-color="black" stop-opacity=".04"/><stop offset="1" stop-color="black" stop-opacity=".22"/></radialGradient><linearGradient id="donut-edge-gloss" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white" stop-opacity=".65"/><stop offset=".55" stop-color="white" stop-opacity=".15"/><stop offset="1" stop-color="white" stop-opacity=".32"/></linearGradient>'+defs+'</defs>'+ '<g transform="translate(20 '+offset+')">'+walls.sort((a,b)=>a.z-b.z).map(x=>x.html).join('')+tops.join('')+'</g>'+lab+'<text x="170" y="'+(87+offset)+'" text-anchor="middle" font-size="8.5" fill="currentColor">可処分資産</text><text x="170" y="'+(101+offset)+'" text-anchor="middle" font-size="'+(fmt(free).length>10?9:12)+'" font-weight="700" fill="currentColor">'+fmt(free)+'</text></svg>';
}


const colors=['#168ce8','#f6a21a','#ef5273','#8956e8','#16baca','#ff7043','#e5bc23','#536bd8','#a64bd0','#25b985'];function show(n){const names=['飲料','交際費','買い物','食事','支払い','雑費','交通費','趣味・娯楽','日用品','医療費','通信費','衣類','書籍','手数料','その他'];const rows=Array.from({length:n},(_,i)=>[names[i],(i+1)*100]);const total=rows.reduce((s,x)=>s+x[1],0);document.getElementById('total').textContent=fmt(total);document.getElementById('home-expense-breakdown').innerHTML='<div class="row"><b>12月分 支出内訳</b><small>11/25〜12/24</small></div>'+raisedExpensePie(rows,colors)+rows.map(([name,amount],i)=>'<div style="margin-bottom:12px"><div class="row" style="font-size:13px"><span>'+name+'</span><b>'+fmt(amount)+'</b></div><div style="height:6px;background:#ddd;border-radius:6px;margin-top:5px"><div style="height:100%;border-radius:6px;background:'+colors[i%colors.length]+';width:'+amount/total*100+'%"></div></div></div>').join('');}show(15);</script></html>
