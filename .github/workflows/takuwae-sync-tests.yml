name: Takuwae sync tests

on:
  push:
    branches: [feature/sync-v2.1.0]
    paths:
      - 'supabase/**'
      - '.github/workflows/takuwae-sync-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check supabase/sync-model.js
          node --check supabase/sync-api.js
      - name: Run isolated synchronization tests
        working-directory: supabase
        run: npm test
