<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>たくわえ｜本体UIの同期接続テスト</title>
<style>body{font:16px/1.6 system-ui;margin:0;background:#edf3f5;color:#17374c}header{max-width:1100px;margin:auto;padding:16px}h1{font-size:1.4rem}button{font:inherit;min-height:44px;padding:8px 14px;margin:4px;border:0;border-radius:8px;background:#255f7b;color:white}button:disabled{opacity:.5}iframe{width:100%;height:900px;border:1px solid #b5cbd5;background:white}.frames{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:1100px;margin:auto;padding:12px}.device{min-width:0}p{margin:8px 0}.status{background:white;border-radius:8px;padding:10px}@media(max-width:800px){.frames{grid-template-columns:1fr}}</style></head>
<body><header><h1>たくわえ｜本体UIの同期接続テスト</h1><p><strong>架空の残高・記録だけを使います。</strong> 本番アプリ・Supabase・既存の保存データには接続しません。再読み込みで初期状態へ戻ります。JSON取込・アプリ更新は無効です。</p>
<p>元の本体画面の「保存」を新しい同期制御につないでいます。AとBで記録した後、A→B→Aの順に同期して確認できます。</p><p id="ready" role="status">準備中</p></header><main id="frames" class="frames"></main>
<script type="module" src="./supabase/sync-candidate.js"></script></body></html>
