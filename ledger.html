/* v0.9 入出金：手描きレイアウトをもとにした2カラム */
.tx-layout{display:grid;grid-template-columns:minmax(0,1fr) 75px;gap:13px;align-items:start}
.tx-fields{display:grid;gap:13px;min-width:0}
.tx-actions{display:grid;gap:10px;align-content:start}
.tx-kind{min-height:58px;padding:9px 6px;border:2px solid transparent;border-radius:13px;font-size:19px;font-weight:800;box-shadow:inset 0 0 0 1px #ffffff70}
.tx-kind.tx-expense{background:#f9e7e5;color:#a43e45}

.tx-kind.tx-saving{background:#e5edfc;color:#315ea6}
.tx-kind.tx-transfer{background:#f7eedc;color:#95691d}

.tx-submit{min-height:92px;background:#355c77;font-size:19px;padding:10px 5px}

.quick-tabs{margin-top:12px;margin-bottom:12px}.quick-panel h3{margin:16px 0 9px}.quick-heading{justify-content:flex-start;gap:12px;margin-bottom:9px}.quick-clear{padding:5px 9px;font-size:14px}.quick-amount-row{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px}.quick-amount{height:56px;display:flex;align-items:center;gap:5px;border:1px solid #cbd5df;border-radius:11px;padding:0 9px;min-width:0}.quick-amount input{border:0;padding:5px 0;min-width:0;font-size:22px}.quick-record{height:56px;padding:0 5px;background:#397e6c}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick-choice{height:64px;background:#f2f5f8;color:#263a50;border:1px solid #cbd5df;padding:5px}
/* Keep the note closer to the fixed navigation without altering other tabs. */
body:has(.quick-tabs) main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
body:has(.quick-tabs) #view{flex:1;display:flex;flex-direction:column;min-height:0}
body:has(.quick-tabs) .quick-panel{flex:1;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:10px}
body:has(.quick-tabs) .foot{margin-top:0}

/* Original capture time is larger than the date in transaction history. */
.original-time{font-weight:750;font-size:21px;line-height:1.25;color:#2c5472;margin-top:3px;font-variant-numeric:tabular-nums}
/* Two totals remain baseline-aligned even when the labels wrap. */
.fund-summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end;margin-bottom:12px}
.fund-metric{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}

}

.home-switch{width:min(620px,100%);padding:0 8px 7px;flex-shrink:0}
.home-switch[hidden]{display:none}
.home-switch button{min-height:46px;font-size:16px;padding:11px 8px}
/* Clearly distinguish the active home sections. */
.home-switch button:first-child.active{background:#326fa5;color:#fff}
.home-switch button:nth-child(2).active{background:#f2d77b;color:#493b18}

body:has(.home-switch:not([hidden])) main{padding-bottom:calc(var(--installed-nav-height, 130px) + 16px)}

/* Takuwae notebook UI refresh 2026-11-21: visual-only overrides */
:root{--notebook-navy:#12384d;--notebook-blue:#2b7189;--notebook-cream:#fffaf0;--notebook-shadow:0 4px 0 #d9d0c1,0 8px 16px #453d2c13}

.hero,.card{background:linear-gradient(145deg,#fffdf8,#faf5eb);border:1px solid #e0d6c7;border-radius:20px;box-shadow:var(--notebook-shadow)}
.hero{position:relative;padding:21px;margin-bottom:17px}
.hero:before{content:"";position:absolute;top:10px;left:12px;right:12px;height:1px;background:#eae1d5}
.hero small,.card>small{color:#496176;font-weight:650}

.card .entry{border-bottom:1px dashed #ddd1c0}
button{background:linear-gradient(#37809b,#23617b);border-radius:13px;box-shadow:0 3px 0 #18465a2b,0 5px 9px #21374c10}

input,select,textarea{background:#fffdf9;border-color:#cfc6b8;border-radius:11px}
.seg{background:#fdf9f2;border:1px solid #ddd0be;box-shadow:0 3px 5px #3d3a3115;gap:4px}

.home-switch{padding:7px 9px 10px;background:#f8f0e4;border-top:1px solid #e7dac8;border-radius:16px 16px 0 0}

/* Home switch: transparent strip, active icon and pill only. */

 transform:translateX(-50%);width:min(620px,100%);

/* Rounded hand-drawn tab pictograms; preserve six-tab layout. */

.nav-inner button:nth-child(4){--tab-ink:#aa547b;--tab-paper:#ffe1ec}
.nav-inner button:nth-child(5){--tab-ink:#8060b2;--tab-paper:#eee4fb}
.nav-inner button:nth-child(6){--tab-ink:#5b86a0;--tab-paper:#e2eff2}
.nav-inner button.active .nav-icon{stroke:var(--tab-ink);filter:saturate(1.15) brightness(1.06);transform:translateY(-1px)}
.nav-inner button .piggy-nav{width:31px;height:31px;border-radius:11px;background:#ffe0ec;box-shadow:inset 0 0 0 1px #ffffff78,0 1px 2px #061f302a}
.nav-inner button .piggy-face{font-size:24px}
.nav-inner button .piggy-coin{right:-3px;top:-3px}

/* v25: real full-color emoji pictograms, not tinted line drawings. */
.nav-inner .emoji-nav{
 display:inline-flex;align-items:center;justify-content:center;
 width:31px;height:31px;flex:none;border-radius:11px;
 font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
 font-size:24px;font-weight:400;line-height:1;
 background:#fff6e7;box-shadow:inset 0 0 0 1px #ffffff80,0 1px 2px #061f302a;
}
.nav-inner .emoji-home{background:#e1f3e6}
.nav-inner .emoji-entry{background:#e3edfa}
.nav-inner .emoji-bills{background:#fff0d6}
.nav-inner .emoji-history{background:#eee6fb}
.nav-inner .emoji-settings{background:#e2eff2}
.nav-inner button.active .emoji-nav,.nav-inner button.active .piggy-nav{filter:brightness(1.06);transform:translateY(-1px)}

/* Approved B: vivid red/blue cashflow arrows and gold yen coin. */
.nav-inner .entry-money-icon{width:34px;height:34px;object-fit:contain;display:block;border-radius:9px;flex:none}
.nav-inner button.active .entry-money-icon{filter:brightness(1.08);transform:translateY(-1px)}

/* v27: clear selected tab using a softly lit floating tile. */
.nav-inner{align-items:center}
.nav-inner button{
 position:relative;transform-origin:center bottom;
 transition:transform 170ms ease, background-color 170ms ease, box-shadow 170ms ease;
}
.nav-inner button.active{
 background:linear-gradient(180deg,rgba(255,251,231,.25),rgba(240,230,198,.13));
 color:#ffe184;
 border-radius:13px;
 box-shadow:0 0 0 1px rgba(255,245,209,.32),0 4px 10px rgba(0,12,22,.25);
 transform:translateY(-2px) scale(1.055);
 z-index:1;
}
.nav-inner button.active .nav-label{color:#ffe184}
@media(prefers-reduced-motion:reduce){.nav-inner button{transition:none}}

/* v28: gently mute only the five unselected tabs, preserving full-color artwork. */
.nav-inner button:not(.active) .nav-icon,
.nav-inner button:not(.active) .emoji-nav,
.nav-inner button:not(.active) .piggy-nav,
.nav-inner button:not(.active) .entry-money-icon{
 filter:saturate(.68) brightness(.88);
 opacity:.88;
 transition:filter 170ms ease,opacity 170ms ease;
}
.nav-inner button:not(.active) .nav-label{color:#b9c9d2;transition:color 170ms ease}
.nav-inner button.active .nav-icon,
.nav-inner button.active .emoji-nav,
.nav-inner button.active .piggy-nav,
.nav-inner button.active .entry-money-icon{opacity:1}
@media(prefers-reduced-motion:reduce){
 .nav-inner button:not(.active) .nav-icon,
 .nav-inner button:not(.active) .emoji-nav,
 .nav-inner button:not(.active) .piggy-nav,
 .nav-inner button:not(.active) .entry-money-icon{transition:none}
}

/* v30 six softly dimensional tab illustrations: icon-only, no background panels. */
.nav-inner .nav-illustration{display:block;flex:none;width:42px;height:42px;max-width:100%;overflow:visible;filter:drop-shadow(0 2px 1px rgba(0,10,25,.28));transition:filter 170ms ease}
.nav-inner button{gap:1px;padding-top:5px;padding-bottom:6px;min-height:65px}
.nav-inner button:not(.active) .nav-illustration{filter:saturate(.68) brightness(.88) drop-shadow(0 1px 1px rgba(0,10,25,.18));opacity:.88}
.nav-inner button.active .nav-illustration{filter:drop-shadow(0 3px 2px rgba(0,10,25,.3));opacity:1}
.nav-inner button .nav-label{font-size:13px}
@media(max-width:390px){.nav-inner .nav-illustration{width:37px;height:37px}.nav-inner button .nav-label{font-size:12px}}
@media(prefers-reduced-motion:reduce){.nav-inner .nav-illustration{transition:none}}

/* v35: slightly larger, lighter labels; preserve selected state and icon layout. */
.nav-inner button .nav-label{font-size:14px;font-weight:550;letter-spacing:0;line-height:1.2}
.nav-inner button.active .nav-label{font-weight:650}
@media(max-width:390px){.nav-inner button .nav-label{font-size:13px}}

header.washi-header{
 position:relative;
 min-height:126px;
 margin:0 0 18px;
 padding:26px 38px 20px;
 border:0;
 border-bottom:1px solid rgba(132,110,80,.20);
 display:flex;align-items:center;justify-content:center;
 text-align:center;
 background:linear-gradient(180deg,rgba(255,252,245,.60),rgba(255,250,240,.13));
}
header.washi-header:before{
 content:"";
 position:absolute;
 left:-14px;top:16px;bottom:18px;width:34px;
 background-image:
  radial-gradient(ellipse 15px 10px at 17px 9px,transparent 55%,#8d7858 59%,#e3c68c 68%,#786342 73%,transparent 80%),
  radial-gradient(ellipse 15px 10px at 17px 48px,transparent 55%,#8d7858 59%,#e3c68c 68%,#786342 73%,transparent 80%),
  radial-gradient(ellipse 15px 10px at 17px 87px,transparent 55%,#8d7858 59%,#e3c68c 68%,#786342 73%,transparent 80%);
 background-repeat:no-repeat;
 background-size:34px 22px,34px 22px,34px 22px;
 background-position:0 0,0 39px,0 78px;
 opacity:.94;
}
header.washi-header:after{
 content:"✒";
 right:2px;top:52px;
 font-size:31px;color:#9b6b35;
 transform:rotate(-26deg);
 opacity:.92;
}
header.washi-header h1{
 font-size:clamp(29px,calc(7.3vw + 2px),39px);
 letter-spacing:.12em;font-weight:750;
 color:#142d49;text-shadow:0 1px 0 #fff9;
 white-space:nowrap;
}
header.washi-header h1:before{content:"🌱";font-size:.66em;vertical-align:3px;margin-right:8px;letter-spacing:0}
header.washi-header small{
 display:block;margin-top:7px;font-size:clamp(13px,calc(3vw + 2px),16px);
 font-weight:500;letter-spacing:.055em;color:#334151;
}
header.washi-header .pill{position:absolute;right:0;bottom:-12px;z-index:1}
@media(max-width:390px){
 header.washi-header{min-height:117px;padding:23px 21px 20px}
 header.washi-header:after{right:-2px;font-size:25px}
}

/* v42 — soft dimensional cards on cream felt, visual-only overrides. */
#view .card,
#view .hero{
  background:linear-gradient(155deg,#fffefb 0%,#fffcf6 47%,#f7f0e5 100%);
  border:1px solid #e6dacc;
  border-radius:20px;
  box-shadow:
    0 3px 0 rgba(203,187,166,.83),
    0 6px 9px rgba(83,65,45,.12),
    0 13px 22px rgba(68,53,40,.075),
    inset 0 1px 0 rgba(255,255,255,.96);
}
#view .hero{
  box-shadow:
    0 4px 0 rgba(194,177,155,.92),
    0 8px 13px rgba(77,60,42,.16),
    0 17px 28px rgba(77,60,42,.095),
    inset 0 1px 0 #fff;
}
#view .grid>.card{
  box-shadow:
    0 2px 0 rgba(209,194,174,.84),
    0 5px 9px rgba(83,65,45,.11),
    0 10px 18px rgba(68,53,40,.06),
    inset 0 1px 0 rgba(255,255,255,.92);
}

/* v45: replace oversized native iOS month picker with bounded month navigation. */
#view .bill-month-field{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
#view .bill-month-nav{
 display:grid;
 grid-template-columns:42px minmax(0,1fr) 42px;
 align-items:center;
 gap:8px;
 width:100%;
 min-width:0;
 max-width:100%;
 padding:5px;
 background:#fffdf8;
 border:1px solid #d6c9b7;
 border-radius:13px;
 box-sizing:border-box;
}
#view .bill-month-nav button{
 display:flex;align-items:center;justify-content:center;
 width:42px;height:44px;min-width:0;
 margin:0;padding:0;
 font-size:27px;line-height:1;font-weight:500;
 background:linear-gradient(#f8f3ea,#ece3d6);
 color:#25445c;
 box-shadow:0 2px 3px rgba(72,57,41,.10);
}
#view .bill-month-value{
 display:block;min-width:0;
 text-align:center;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;
 font-weight:750;font-size:clamp(16px,calc(4vw + 2px),19px);color:#29435b;
}

/* v49: whisper-light pale aqua tint on existing milk-glass cards; preserve transparency and shadows. */
#view .card,
#view .hero{
  background:linear-gradient(150deg,rgba(250,253,255,.81) 0%,rgba(247,252,255,.75) 55%,rgba(246,250,253,.71) 100%);
  border:1px solid rgba(255,255,255,.87);
  border-radius:20px;
  -webkit-backdrop-filter:blur(12px) saturate(112%);
  backdrop-filter:blur(12px) saturate(112%);
  box-shadow:0 4px 10px rgba(83,72,61,.14),0 11px 22px rgba(83,72,61,.065),inset 0 1px 0 rgba(255,255,255,.94);

 const f=funds();

function home(){const a=balances(),f=funds(),unknowns=unknown();const unpaid=pending();const reserveNeeded=Math.max(0,(db.fundCategories.find(x=>x.id==='repair')?.goal||300000)-f.repair);const all=Object.values(a).reduce((x,y)=>x+y,0);const pendingCards=db.tx.filter(t=>t.kind==='expense'&&!t.settled).reduce((x,t)=>x+t.amount,0);const monthSaved=db.tx.filter(t=>t.kind==='saving'&&t.purpose==='car'&&String(t.date||'').slice(0,7)===ym()).reduce((sum,t)=>sum+Number(t.amount||0),0);const savingToProtect=Math.max(0,Number(db.monthly||0)-monthSaved);const free=Math.max(0,a.r-unpaid-pendingCards-db.weeklyBuffer-savingToProtect);const weekly=Math.floor(free/4);return `<div class="hero"><small>今週あと使えるお金 · 暫定目安</small><div class="big">${fmt(weekly)}</div><div class="progress"><div style="width:${Math.min(100,Math.max(0,weekly/30000*100))}%"></div></div><p class="caption">りそなの帳簿残高から、未払いの入力済み固定費・後払い予定・生活費確保額・今月の未積立予定額 ${fmt(savingToProtect)} を差し引き、4等分した簡易試算。積立が三井住友①から行われる場合も安全側に控除する暫定方式。</p>${unknowns?`<div class="notice">金額未入力の固定費が${unknowns}件あるため、使える額は確定してへんで。</div>`:''}</div><div class="card"><h3>口座・財布の残高</h3>${accountDisplayOrder().map(k=>`<div class="row entry"><span>${names[k]}</span><strong>${fmt(a[k])}</strong></div>`).join('')}<div class="row" style="margin-top:12px"><b>帳簿上の資産合計</b><b>${fmt(all)}</b></div></div>${homeFundCards()}<button style="width:100%" onclick="setTab('entry')">＋ 入出金を記録</button><p class="caption">※三井住友②の用途別合計 ${fmt(db.fundCategories.reduce((sum,x)=>sum+(Number(f[x.id])||0),0))} ／ 実残高 ${fmt(a.s2)}。差額 ${fmt(a.s2-db.fundCategories.reduce((sum,x)=>sum+(Number(f[x.id])||0),0))} は未分類資金として扱う。</p>`}
function entry(){

const purpose=ui.type==='saving'?'<div class="field"><label>積立用途</label><select name="purpose">'+db.fundCategories.map(f=>'<option value="'+esc(f.id)+'">'+esc(f.name)+'</option>').join('')+'</select></div>':'';
return '<div class="card"><h2>入出金を記録</h2><form id="txform" onsubmit="submitTx(event)"><div class="tx-layout"><div class="tx-fields"><div class="field"><label>金額（円）</label><input name="amount" inputmode="numeric" type="number" min="1" step="1" required placeholder="¥ 0"></div>'+extra+'<div class="field"><label>'+source+'</label><select name="from">'+options(ui.type==='income'?'s1':ui.type==='saving'?'s1':'r')+'</select></div>'+destination+purpose+'<div class="field"><label>メモ（任意）</label><input name="note" placeholder="内容を入力"></div></div><div class="tx-actions">'+buttons+'<button type="submit" class="tx-submit">記録する<small>'+current+'を登録</small></button></div></div><div class="tx-date field"><label for="tx-date-open">日付</label><input type="hidden" name="date" id="tx-date-value" value="'+today()+'"><button type="button" id="tx-date-open" class="tx-date-open" onclick="openTxDateWheel()" aria-haspopup="dialog">'+today().replace(/^(\d{4})-(\d{2})-(\d{2})$/,(_,y,m,d)=>y+'年'+Number(m)+'月'+Number(d)+'日')+'</button></div></form><p class="caption" style="margin-top:12px">右側で取引の種類を選び、左側に金額などを入力してな。</p></div>';
}
function submitTx(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const n=Number(d.amount);if(!(n>0))return;let t={kind:ui.type,amount:n,date:d.date,note:d.note||'',category:d.category||titleKind(ui.type)};if(ui.type==='income'){t.to=d.from}else if(ui.type==='expense'){t.from=d.from;t.settled=d.method!=='credit';t.method=d.method}else{if(d.from===d.to)return alert('振替元と振替先は別にしてな');if(ui.type==='saving'&&d.to!=='s2')return alert('積立先は三井住友②にしてな');if(ui.type==='saving'&&d.from==='s2')return alert('同じ貯蓄口座内の用途変更は設定から行ってな');t.from=d.from;t.to=d.to;t.purpose=d.purpose}if(['saving','transfer'].includes(ui.type)&&balances()[t.from]<n)return alert('振替元の帳簿残高が不足してるで。先に残高を確認してな');record(t);ui.tab='history';render()}

function billsView(){const bs=activeBills();return `<div class="row" style="margin-bottom:10px"><h2>固定費管理</h2><button class="secondary bill-edit-relief" onclick="ui.edit=!ui.edit;ui.selected=[];render()">${ui.edit?'完了':'編集'}</button></div><div class="hero"><small>今月の引き落とし確認済み合計</small><div class="big navy">−${fmt(totalBill())}</div><small>${bs.filter(b=>billState(b).paid).length}/${bs.length}件確認済み · ${ui.month}</small></div><div class="card"><div class="field bill-month-field" style="margin-bottom:12px"><label>表示月</label><div class="bill-month-nav"><button type="button" class="secondary" aria-label="前の月" onclick="shiftBillMonth(-1)">‹</button><span class="bill-month-value" aria-live="polite">${billMonthLabel()}</span><button type="button" class="secondary" aria-label="次の月" onclick="shiftBillMonth(1)">›</button></div></div>${bs.map(b=>{const s=billState(b);return `<div class="bill"><div class="row">${ui.edit?`<input class="checkselect" type="checkbox" onchange="toggleSelect('${b.id}',this.checked)">`:''}<b style="flex:1">${esc(b.name)}</b><small>${s.paid?'確認済み':'未確認'}</small></div>${!ui.edit?`<div class="bill-fields"><select aria-label="支払元" onchange="changeBill('${b.id}','bank',this.value)">${options(s.bank,true,accountKeys())}</select><label class="tick"><input type="checkbox" data-bill-id="${b.id}" aria-label="${esc(b.name)}の引落確認" ${s.paid?'checked':''} onchange="confirmBill('${b.id}',this.checked)"></label><input aria-label="金額" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="金額" value="${esc(s.amount)}" oninput="changeBillAmount('${b.id}',this.value)"></div>${ui.billNotice===b.id?`<div class="bill-hint" role="alert">支払元口座と金額を入力してから確認してな。</div>`:''}`:''}</div>`}).join('')}${ui.edit?`<button class="danger" style="width:100%;margin-top:12px" onclick="scheduleDelete()">選択項目を翌月から削除</button>`:''}</div><div class="card"><button type="button" class="secondary fund-add-button" style="width:100%" onclick="ui.add=!ui.add;render()"><span class="fund-add-plus" aria-hidden="true">＋</span><span>固定費を追加</span></button>${ui.add?`<form class="stack" style="margin-top:14px" onsubmit="addBill(event)"><div class="field"><label>名称</label><input name="name" required></div><div class="field"><label>支払元</label><select name="bank">${options('s1',false,accountKeys())}</select></div><div class="actions"><button class="secondary" type="button" onclick="ui.add=false;render()">キャンセル</button><button>当月から追加</button></div></form>`:''}</div><p class="caption">追加は当月から、削除は翌月から反映。月ごとの金額は空欄で始まるで。固定費の確認取消や金額訂正は帳簿の記録と連動する。</p>`}
function changeBillAmount(bid,val){const b=db.bills.find(x=>x.id===bid),st=billState(b);if(st.paid)return;st.amount=val;save();const tick=document.querySelector('input[data-bill-id="'+bid+'"]');if(tick)tick.disabled=false};function changeBill(bid,field,val){const b=db.bills.find(x=>x.id===bid),s=billState(b);if(s.paid){if(!confirm('確認済みの記録を取り消して編集する？'))return;unconfirm(bid)}s[field]=val;ui.billNotice=null;save();render()};function unconfirm(bid){const s=month()[bid];if(s)s.paid=false;db.tx=db.tx.filter(t=>t.billKey!==ui.month+':'+bid)};function confirmBill(bid,checked){const b=db.bills.find(x=>x.id===bid),s=billState(b);if(checked){if(!(Number(s.amount)>0)||!s.bank){ui.billNotice=bid;render();return;}ui.billNotice=null;db.tx=db.tx.filter(t=>t.billKey!==ui.month+':'+bid);db.tx.unshift({id:id(),kind:'expense',from:s.bank,amount:Number(s.amount),date:today(),category:b.name,settled:true,accountLabelsAtRecord:{[s.bank]:names[s.bank]},billKey:ui.month+':'+bid});s.paid=true}else{unconfirm(bid)}ui.billNotice=null;save();render()};function toggleSelect(id,on){ui.selected=on?[...ui.selected,id]:ui.selected.filter(x=>x!==id)};function scheduleDelete(){if(!ui.selected.length)return alert('削除する項目を選んでな');if(!confirm('選択した固定費を翌月から一覧から外す？ 過去の履歴は残るで。'))return;const [y,m]=ui.month.split('-').map(Number),next=`${m===12?y+1:y}-${String(m===12?1:m+1).padStart(2,'0')}`;for(const b of db.bills)if(ui.selected.includes(b.id))b.end=next;ui.edit=false;ui.selected=[];save();render()};function addBill(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));db.bills.push({id:id(),name:d.name.trim(),bank:d.bank,start:ui.month,active:true});ui.add=false;save();render()}
function savingView(){const f=funds();return `<h2><span class="saving-handline heading-line saving-feature-title">積立・将来の見通し</span></h2><div class="grid">${db.fundCategories.map((x,i)=>`<div class="card"><small class="saving-handline saving-color-${i%5}">${esc(x.name)}</small><strong class="blue saving-amount-wave" style="display:block;font-size:22px">${fmt(f[x.id]||0)}</strong><small>${x.goal?'目標 '+fmt(x.goal):'用途別積立'}</small></div>`).join('')}</div><div class="card"><div class="row"><h3><span class="saving-handline heading-line saving-feature-title">積立項目の管理</span></h3><button type="button" class="secondary fund-add-button" onclick="ui.addFund=!ui.addFund;render()"><span class="fund-add-plus" aria-hidden="true">＋</span><span>項目を追加</span></button></div>${ui.addFund?`<form class="stack" onsubmit="addFund(event)" style="padding:12px 0"><div class="field"><label>積立項目名</label><input name="fundName" placeholder="例：旅行資金" maxlength="40" required></div><div class="field"><label>目標金額（円・任意）</label><input name="fundGoal" type="number" inputmode="numeric" min="0" step="1" placeholder="未設定なら0"></div><div class="actions"><button type="button" class="secondary" onclick="ui.addFund=false;render()">キャンセル</button><button type="submit">追加する</button></div></form>`:''}${db.fundCategories.map((x,i)=>`<div class="row entry"><span class="saving-handline saving-color-${i%5}">${esc(x.name)}</span><span>${!['repair','car'].includes(x.id)?`<button class="outline" style="padding:6px 9px" onclick="ui.deleteFund='${x.id}';render()">削除</button>`:''}</span></div>`).join('')}${ui.deleteFund?`<div class="notice"><b>${esc(fundName(ui.deleteFund))}を削除する？</b><p>残高0円の項目だけ削除できるで。取引履歴は残す。</p><div class="actions"><button class="secondary" onclick="ui.deleteFund=null;render()">キャンセル</button><button class="danger" onclick="removeFund(ui.deleteFund)">削除を確定</button></div></div>`:""}<p class="caption">追加した項目は「入出金 → 積立」から選べるで。残高が0円なら削除できるで。過去の履歴は保持する。</p></div><div class="card"><h3>資金推移グラフ</h3><canvas id="chart" width="700" height="320" aria-label="積立資金の推移グラフ。点をタップすると日付と金額を表示"></canvas><div id="chart-detail" class="chart-detail" aria-live="polite">グラフの点をタップすると、年月日と金額が表示されるで。</div><p class="chart-tip">青：${esc(fundName('car'))} ／ 緑：${esc(fundName('repair'))} ／ その他：追加項目</p><p class="caption">追加項目は将来の積立額が未設定のため、現状維持で表示するで。</p></div><div class="card stack"><div class="field"><label>毎月の${esc(fundName('car'))}積立目標</label><input type="number" inputmode="numeric" value="${db.monthly}" onchange="db.monthly=Number(this.value)||0;save();render()"></div><div class="field"><label>${esc(fundName('car'))}向けボーナス積立（1回分）</label><input type="number" inputmode="numeric" value="${db.bonus}" onchange="db.bonus=Number(this.value)||0;save();render()"></div><p class="caption">2027年夏は${esc(fundName('repair'))}へ20万円を補填する計画。</p><div class="actions"><button class="saving-action-button" onclick="ui.type='saving';setTab('entry')">積立を記録</button><button class="secondary saving-action-button" onclick="setTab('withdraw')">資金を取り崩す</button></div></div>`}
function addFund(event){event.preventDefault();const form=event.currentTarget;const n=form.elements.fundName.value.trim();const raw=form.elements.fundGoal.value;const goal=raw===''?0:Number(raw);if(!n||n.length>40)return alert('1〜40文字で入力してな');if(db.fundCategories.some(x=>x.name===n))return alert('同じ名前があるで');if(!Number.isSafeInteger(goal)||goal<0)return alert('0以上の整数で入力してな');db.fundCategories.push({id:'fund_'+id(),name:n,goal});ui.addFund=false;save();render()}
function renameFund(fid){const fund=db.fundCategories.find(x=>x.id===fid);if(!fund)return;const input=prompt('積立用途の新しい名前（1〜40文字）',fund.name);if(input===null)return;const name=input.trim();if(!name||name.length>40)return alert('項目名は1〜40文字で入力してな');if(db.fundCategories.some(x=>x.id!==fid&&x.name===name))return alert('同じ名前の項目があるで');if(fund.name===name)return;fund.name=name;save();render()}
function changeFundInitial(fid,value){if(!db.fundCategories.some(x=>x.id===fid))return;const n=Number(value);if(value===''||!Number.isSafeInteger(n)||n<0){alert('初期残高は0以上の整数で入力してな');render();return;}db.fundInitial[fid]=n;save()}
function removeFund(fid){if(['repair','car'].includes(fid))return;if((funds()[fid]||0)!==0)return alert('残高がある項目は削除できへん');db.fundCategories=db.fundCategories.filter(x=>x.id!==fid);ui.deleteFund=null;if(!db.tx.some(t=>t.purpose===fid))delete db.fundInitial[fid];save();render()}

/* v36: safe in-app PWA update check. Does not modify financial storage. */
const TAKUWAE_APP_VERSION='2.3.3';
let takuwaeUpdateBusy=false;
const settingsViewBeforeUpdate=settingsView;
settingsView=function(){
 return settingsViewBeforeUpdate()+
 '<div class="card stack"><h3>アプリの更新</h3>'+
 '<p class="caption">現在のアプリ：v'+TAKUWAE_APP_VERSION+'。通信して最新版を確認するで。家計の保存データは削除せえへんよ。</p>'+
 '<button type="button" id="takuwae-update-button" onclick="checkTakuwaeUpdate()">最新版を確認して更新</button>'+

};
async function checkTakuwaeUpdate(){
 if(takuwaeUpdateBusy)return;
 takuwaeUpdateBusy=true;
 const btn=document.getElementById('takuwae-update-button'),status=document.getElementById('takuwae-update-status');
 if(btn)btn.disabled=true;
 const announce=message=>{if(status)status.textContent=message;};
 announce('最新版を確認中…');
 try{
  if(!navigator.onLine)throw new Error('オフラインやで。ネット接続を確認してな。');
  const url=new URL('./index.html',location.href);
  url.searchParams.set('_update_check',String(Date.now()));
  const response=await fetch(url.href,{cache:'no-store'});
  if(!response.ok)throw new Error('最新版の取得に失敗したで（HTTP '+response.status+'）。');
  const html=await response.text();
  const match=html.match(/<meta name="takuwae-version" content="([0-9]+\.[0-9]+\.[0-9]+)">/);
  if(!match)throw new Error('公開版のバージョンを確認できへんかった。再読み込みはせずに終了するで。');
  const published=match[1];
  const compareVersions=(a,b)=>{
   const left=a.split('.').map(Number),right=b.split('.').map(Number);
   for(let i=0;i<3;i++){if(left[i]!==right[i])return left[i]>right[i]?1:-1;}
   return 0;
  };
  const comparison=compareVersions(published,TAKUWAE_APP_VERSION);
  if(comparison<0)throw new Error('公開サーバーが古い版を返しているで。しばらくしてから試してな。');
  if('serviceWorker' in navigator){
   const registration=await navigator.serviceWorker.getRegistration();
   if(registration)await registration.update();
  }
  if(comparison===0){
   announce('v'+published+' が最新やで。表示が古い場合は、アプリを終了して開き直してな。');
   return;
  }
  announce('v'+published+' を取得したで。画面を更新するな。');
  location.replace(url.href);
 }catch(e){
  announce('更新できへんかった：'+(e&&e.message?e.message:String(e))+' 家計データは変更してへんで。');

/* v50 date wheel: draft selection remains local until confirmed. */
let txWheelDraft=null;
function txWheelISO(v){const [y,m,d]=v;return String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function txWheelDays(y,m){return new Date(y,m,0).getDate()}
function txWheelOptions(type){
 const d=txWheelDraft,yearNow=new Date().getFullYear();
 if(type==='year')return Array.from({length:yearNow-1990+6},(_,i)=>1990+i);
 if(type==='month')return Array.from({length:12},(_,i)=>i+1);
 return Array.from({length:txWheelDays(d[0],d[1])},(_,i)=>i+1);
}
function txWheelFill(type){
 const col=document.getElementById('tx-wheel-'+type);if(!col)return;
 const pos={year:0,month:1,day:2}[type],options=txWheelOptions(type);
 col.innerHTML='<div class="tx-wheel-spacer"></div>'+options.map(v=>'<div class="tx-wheel-item" data-value="'+v+'" aria-selected="'+(v===txWheelDraft[pos])+'">'+v+(type==='year'?'年':type==='month'?'月':'日')+'</div>').join('')+'<div class="tx-wheel-spacer"></div>';
 col.scrollTop=options.indexOf(txWheelDraft[pos])*44;
}
function txWheelSync(type){
 if(!txWheelDraft)return;
 const col=document.getElementById('tx-wheel-'+type);if(!col)return;
 const vals=txWheelOptions(type),pos={year:0,month:1,day:2}[type];
 const idx=Math.max(0,Math.min(vals.length-1,Math.round(col.scrollTop/44)));
 const next=vals[idx];if(next===undefined)return;
 const old=txWheelDraft[pos];txWheelDraft[pos]=next;
 col.querySelectorAll('.tx-wheel-item').forEach((item,i)=>item.setAttribute('aria-selected',i===idx?'true':'false'));
 if(old!==next&&(type==='year'||type==='month')){
  const max=txWheelDays(txWheelDraft[0],txWheelDraft[1]);
  if(txWheelDraft[2]>max)txWheelDraft[2]=max;
  txWheelFill('day');
 }
}
function openTxDateWheel(){
 const input=document.getElementById('tx-date-value');if(!input)return;
 const parts=input.value.split('-').map(Number);
 if(parts.length!==3||parts.some(x=>!Number.isFinite(x)))return;
 txWheelDraft=parts;
 document.getElementById('tx-wheel-overlay')?.remove();
 const overlay=document.createElement('div');overlay.className='tx-wheel-overlay';overlay.id='tx-wheel-overlay';
 overlay.innerHTML='<section class="tx-wheel-dialog" role="dialog" aria-modal="true" aria-label="日付を選択"><div class="tx-wheel-heading"><span>日付を選択</span><button type="button" onclick="closeTxDateWheel()">キャンセル</button></div><div class="tx-wheel-picker"><div class="tx-wheel-columns">'+['year','month','day'].map(t=>'<div class="tx-wheel-col" id="tx-wheel-'+t+'" role="listbox" aria-label="'+({year:'年',month:'月',day:'日'}[t])+'"></div>').join('')+'</div></div><button type="button" class="tx-wheel-confirm" onclick="confirmTxDateWheel()">この日付に決定</button></section>';
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeTxDateWheel()});
 document.body.appendChild(overlay);
 ['year','month','day'].forEach(type=>{
  txWheelFill(type);
  const col=document.getElementById('tx-wheel-'+type);
  let timer;
  col.addEventListener('scroll',()=>{
   txWheelSync(type);
   clearTimeout(timer);timer=setTimeout(()=>{const vals=txWheelOptions(type),pos={year:0,month:1,day:2}[type];col.scrollTo({top:Math.max(0,vals.indexOf(txWheelDraft[pos]))*44,behavior:'smooth'});},110);
  },{passive:true});
  col.addEventListener('click',e=>{
   const item=e.target.closest('.tx-wheel-item');if(!item)return;
   col.scrollTo({top:Math.max(0,txWheelOptions(type).indexOf(Number(item.dataset.value)))*44,behavior:'smooth'});
  });
 });
}
function closeTxDateWheel(){document.getElementById('tx-wheel-overlay')?.remove();txWheelDraft=null}
function confirmTxDateWheel(){
 if(!txWheelDraft)return;
 ['year','month','day'].forEach(txWheelSync);
 const input=document.getElementById('tx-date-value'),button=document.getElementById('tx-date-open');
 if(input&&button){
  const [y,m,d]=txWheelDraft;input.value=txWheelISO(txWheelDraft);
  button.textContent=y+'年'+m+'月'+d+'日';
 }
 closeTxDateWheel();
}

let customDrag=null;
function beginSortDrag(grip,x,y,identity){
 if(customDrag)return;
 const item=grip.closest('.custom-sort-item');if(!item)return;

 const ghost=item.cloneNode(true);
 ghost.classList.add('custom-sort-ghost');

 document.body.appendChild(ghost);
 item.classList.add('custom-sort-active');
 customDrag={identity,group:item.dataset.group,key:item.dataset.key,target:null,
  item,grip,ghost,offsetY:y-box.top};
}
function moveSortDrag(x,y,identity){

 d.ghost.style.top=(y-d.offsetY)+'px';

 const target=under&&under!==d.item&&under.dataset.group===d.group?under:null;

 d.target=target?.dataset.key||null;

 else if(y>window.innerHeight-65)window.scrollBy(0,12);

function endSortDrag(identity,commit){

 customDrag=null;d.ghost.remove();
 document.querySelectorAll('.custom-sort-active,.custom-sort-over').forEach(x=>x.classList.remove('custom-sort-active','custom-sort-over'));

const BACKGROUND_DB_NAME='takuwae-production-background-v1';
const BACKGROUND_STORE='preferences';
let selectedBackgroundUrl=null;
let backgroundReady=false;
let customBackgroundPresent=false;
function openBackgroundDb(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window))return reject(new Error('このブラウザでは写真の保存に対応してへん'));
  const req=indexedDB.open(BACKGROUND_DB_NAME,1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(BACKGROUND_STORE))req.result.createObjectStore(BACKGROUND_STORE)};
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error||new Error('写真保存領域を開けへん'));
 });
}
async function backgroundStore(action,value){
 const database=await openBackgroundDb();
 try{
  return await new Promise((resolve,reject)=>{
   const tx=database.transaction(BACKGROUND_STORE,action==='read'?'readonly':'readwrite');
   const store=tx.objectStore(BACKGROUND_STORE);
   let result=null;
   const request=action==='read'?store.get('selected'):action==='clear'?store.delete('selected'):store.put(value,'selected');
   request.onsuccess=()=>{result=request.result};
   request.onerror=()=>reject(request.error||new Error('背景の保存に失敗したで'));
   tx.oncomplete=()=>resolve(result);
   tx.onerror=()=>reject(tx.error||new Error('背景の保存に失敗したで'));
   tx.onabort=()=>reject(tx.error||new Error('背景の保存が中断されたで'));
  });
 }finally{database.close()}
}

}catch(error){}
function headerArtStore(action,value){
 return new Promise((resolve,reject)=>{
  openBackgroundDb().then(dbHandle=>{
   const tx=dbHandle.transaction(BACKGROUND_STORE,action==='read'?'readonly':'readwrite');
   const store=tx.objectStore(BACKGROUND_STORE);
   const request=action==='read'?store.get(HEADER_ART_STORE_KEY):action==='clear'?store.delete(HEADER_ART_STORE_KEY):store.put(value,HEADER_ART_STORE_KEY);
   let result=null;
   request.onsuccess=()=>{result=request.result};
   request.onerror=()=>reject(request.error||new Error('画像の保存に失敗'));
   tx.oncomplete=()=>{dbHandle.close();resolve(result)};
   tx.onerror=()=>{dbHandle.close();reject(tx.error||new Error('画像の保存に失敗'))};
   tx.onabort=()=>{dbHandle.close();reject(tx.error||new Error('画像の保存を中断'))};
  }).catch(reject);
 });
}
function setHeaderArtStatus(msg){const el=document.getElementById('header-art-status');if(el)el.textContent=msg;}
function setHeaderArtMode(mode){

 try{localStorage.setItem(HEADER_ART_KEY,mode)}catch(error){}
 const root=document.querySelector('header.v79-header'),img=document.getElementById('takuwae-header-art');
 if(!root||!img)return;
 root.hidden=mode==='hidden';
 if(mode==='standard'){img.src='./assets/header-current.svg';img.alt='たくわえの標準タイトルイラスト'}
 if(mode==='custom'&&headerArtObjectUrl){img.src=headerArtObjectUrl;img.alt='選択したタイトルイラスト'}
 if(mode==='custom'&&!headerArtObjectUrl){
  root.hidden=true; // Avoid showing the wrong artwork while device-local image loads.
 }
 setHeaderArtStatus(mode==='hidden'?'タイトル画像を非表示にしているで':mode==='custom'?'選んだ画像を表示中':'標準イラストを表示中');
}
async function initializeHeaderArt(){

   headerArtObjectUrl=await backgroundDataURL(blob);
   if(headerArtMode==='custom')setHeaderArtMode('custom');

 }catch(error){if(headerArtMode==='custom')setHeaderArtMode('standard')}

function closeHeaderCrop(){
 const state=headerCrop;headerCrop=null;
 if(state?.image?._takuwaeObjectURL)URL.revokeObjectURL(state.image._takuwaeObjectURL);

function paintHeaderCrop(){
 const c=headerCrop;if(!c)return;
 const ctx=c.canvas.getContext('2d');if(!ctx)return;
 const w=c.canvas.width,h=c.canvas.height;
 const scale=Math.max(w/c.image.naturalWidth,h/c.image.naturalHeight)*c.zoom;
 const dw=c.image.naturalWidth*scale,dh=c.image.naturalHeight*scale;
 c.x=Math.max(w-dw,Math.min(0,c.x));
 c.y=Math.max(h-dh,Math.min(0,c.y));
 ctx.clearRect(0,0,w,h);
 ctx.drawImage(c.image,c.x,c.y,dw,dh);
}
function zoomHeaderCrop(raw){
 const c=headerCrop;if(!c)return;
 const next=Math.max(1,Math.min(4,Number(raw)||1));
 const cx=c.canvas.width/2,cy=c.canvas.height/2;
 c.x=cx-(cx-c.x)*next/c.zoom;c.y=cy-(cy-c.y)*next/c.zoom;
 c.zoom=next;paintHeaderCrop();
}
function dragHeaderCrop(event){
 const c=headerCrop;if(!c)return;
 if(event.type==='pointerdown'){
  if(c.pointerId!==null)return;
  c.pointerId=event.pointerId;c.lastX=event.clientX;c.lastY=event.clientY;
  c.canvas.setPointerCapture(event.pointerId);
 }else if(event.type==='pointermove'&&c.pointerId===event.pointerId){
  const rect=c.canvas.getBoundingClientRect();
  c.x+=(event.clientX-c.lastX)*c.canvas.width/rect.width;
  c.y+=(event.clientY-c.lastY)*c.canvas.height/rect.height;
  c.lastX=event.clientX;c.lastY=event.clientY;paintHeaderCrop();
 }else if(c.pointerId===event.pointerId)c.pointerId=null;
}

async function saveHeaderCrop(){

function backgroundDataURL(blob){

  const reader=new FileReader();
  reader.onload=()=>resolve(String(reader.result||''));
  reader.onerror=()=>reject(reader.error||new Error('写真データの読み込みに失敗したで'));

}

function loadImageSource(src){

  const image=new Image();
  image.onload=()=>image.naturalWidth&&image.naturalHeight?resolve(image):reject(new Error('写真の寸法を取得できへんかった'));

}
async function readPhotoImage(file){

  const objectURL=URL.createObjectURL(file);

   const image=await loadImageSource(objectURL);
   image._takuwaeObjectURL=objectURL;
   return image;
  }catch(secondError){
   URL.revokeObjectURL(objectURL);
   // Last decode path for browsers whose bitmap decoder supports formats
   // not handled by HTMLImageElement (including some iPhone photo exports).
   if(typeof createImageBitmap==='function'){
    try{
     const bitmap=await createImageBitmap(file);
     const canvas=document.createElement('canvas');
     const scale=Math.min(1,2048/Math.max(bitmap.width,bitmap.height));
     canvas.width=Math.max(1,Math.round(bitmap.width*scale));
     canvas.height=Math.max(1,Math.round(bitmap.height*scale));
     const ctx=canvas.getContext('2d');
     if(!ctx)throw Error('画像変換ができへん');
     ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
     if(typeof bitmap.close==='function')bitmap.close();
     return await loadImageSource(canvas.toDataURL('image/jpeg',.86));
    }catch(bitmapError){/* Report a useful format-specific error below. */}
   }
   const extension=String(file.name||'').split('.').pop().toLowerCase();
   if(['heic','heif'].includes(extension)||/hei[cf]/i.test(file.type))
    throw new Error('HEIC/HEIF形式が読み込めへんかった。写真アプリからJPEGとして保存して試してな');
   throw new Error('この写真を読み込めへんかった。JPEGかPNGで再度試してな');
  }

}

async function saveBackgroundCrop(){

let backdropContrastPixels=null,backdropContrastWidth=0,backdropContrastHeight=0,contrastFramePending=false;
function linearChannel(value){const v=value/255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}

async function preparePhotoContrast(blob){
 backdropContrastPixels=null;
 if(!blob){requestPanelContrastUpdate();return}

 try{
  image=await readPhotoImage(blob);
  const canvas=document.createElement('canvas');
  canvas.width=60;canvas.height=Math.max(12,Math.round(60*image.naturalHeight/image.naturalWidth));
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  if(!ctx)throw Error('canvas unavailable');
  ctx.drawImage(image,0,0,canvas.width,canvas.height);
  backdropContrastPixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  backdropContrastWidth=canvas.width;backdropContrastHeight=canvas.height;
 }catch(error){backdropContrastPixels=null}
 finally{if(image?._takuwaeObjectURL)URL.revokeObjectURL(image._takuwaeObjectURL)}

function photoColorAt(x,y){
 const data=backdropContrastPixels;
 if(!data||!backdropContrastWidth||!backdropContrastHeight)return null;
 const vw=Math.max(1,window.innerWidth),vh=Math.max(1,window.innerHeight);
 const scale=Math.max(vw/backdropContrastWidth,vh/backdropContrastHeight);
 const dw=backdropContrastWidth*scale,dh=backdropContrastHeight*scale;
 const px=Math.max(0,Math.min(backdropContrastWidth-1,Math.floor((x-(vw-dw)/2)/scale)));
 const py=Math.max(0,Math.min(backdropContrastHeight-1,Math.floor((y-(vh-dh)/2)/scale)));
 const p=(py*backdropContrastWidth+px)*4;
 return [data[p],data[p+1],data[p+2]];
}
function updatePanelContrast(){
 contrastFramePending=false;
 const alpha=panelOpacity/100;
 for(const panel of document.querySelectorAll('#view .card,#view .hero')){
  panel.classList.remove('adaptive-text-light','adaptive-text-dark');
  if(alpha>=.60||!backdropContrastPixels)continue;
  const rect=panel.getBoundingClientRect();
  if(rect.bottom<0||rect.top>window.innerHeight)continue;
  let dark=Infinity,light=Infinity;
  for(const a of [.18,.50,.82])for(const b of [.20,.50,.80]){

 // Reuse the photo sampler and evaluate the text's own screen position.
 for(const title of document.querySelectorAll('#view h1,#view h2,#view h3,#view h4,#view .original-time')){
  title.classList.remove('adaptive-title-light','adaptive-title-dark');

  for(const a of [.12,.5,.88]){

   if(!bg)continue;

/* Add readable emphasis after each tab render, without changing financial values or controls. */
function applyGlobalLedgerHighlights(){
 const root=document.getElementById('view');if(!root)return;
 let headingIndex=0;
 for(const heading of root.querySelectorAll('h2,h3')){
  // Existing savings markup already has a marker; avoid double highlighting.
  const already=heading.querySelector('.saving-handline');
  if(already){headingIndex++;continue}
  const marker='global-marker-'+(headingIndex%5);
  headingIndex++;
  for(const node of Array.from(heading.childNodes)){
   if(node.nodeType!==Node.TEXT_NODE||!node.textContent.trim())continue;
   const span=document.createElement('span');
   span.className='global-marker-heading '+marker;
   heading.replaceChild(span,node);
   span.textContent=node.textContent;
  }
 }
 // Give every pre-styled savings amount and every standalone displayed amount its own
 // visibly distinct underline. Direct CSS property takes priority over old navy fallback.
 const palette=['#b44a54','#247c75','#8554bd','#b06b20','#2d66ad','#9d487e','#59811c','#a25036'];
 let amountIndex=0;
 for(const el of root.querySelectorAll('strong,b,span,.big,.saving-amount-wave')){
  if(el.closest('button,label,select,textarea,form,.caption,.foot,.notice,.saving-handline'))continue;
  if(el.children.length>0)continue;
  const value=(el.textContent||'').trim();
  const hasWavyStyle=el.classList.contains('saving-amount-wave');
  if(!hasWavyStyle&&!/^[+＋−-]?\s*¥\s*[0-9,]+(?:円)?$/.test(value))continue;
  if(!hasWavyStyle)el.classList.add('global-money-wave');
  const color=palette[amountIndex%palette.length];
  // Set the actual decoration property (important), not only the CSS custom variable.
  el.style.setProperty('text-decoration-color',color,'important');
  el.style.setProperty('--money-wave-color',color);
  amountIndex++;
 }
}
const renderBeforeGlobalHighlights=render;
render=function(){
 const result=renderBeforeGlobalHighlights();
 applyGlobalLedgerHighlights();
 return result;
};
