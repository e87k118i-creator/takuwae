minmax(0,1fr));width:min(620px,100%);gap:2px}.nav button{background:transparent;color:#66788b;padding:11px 1px;font-size:16px;font-weight:650;letter-spacing:-.35px;min-height:48px;white-space:nowrap}.nav button.active{background:#e9eef3;color:#243f65;font-weight:800;border-radius:10px}.bill{padding:13px 0;border-bottom:1px solid #e4e9ee}.bill:last-child{border:0}.bill-fields{display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);gap:7px;align-items:center;margin-top:8px}.tick{display:grid;place-items:center;height:44px;width:48px;cursor:pointer}.tick input{width:30px;height:30px}.green{color:#32815c}.navy{color:#243f65}.blue{color:#3478d4}.amber{color:#9b681e}.progress{height:9px;background:#e4e9ef;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#6d9c8c}.notice{font-size:13px;background:#fff6e7;padding:11px;border-radius:10px;color:#785521;margin-bottom:12px}.pill{font-size:11px;border-radius:20px;padding:4px 8px;background:#edf1f5;color:#536579}.entry{padding:10px 0;border-bottom:1px solid #e7ebef}.entry:last-child{border:0}.entry strong{font-size:16px}.foot{font-size:11px;color:#758498;margin-top:14px;line-height:1.6}.bar{height:12px;border-radius:8px;background:#e8edf3;overflow:hidden;display:flex}.bar span{background:#3478d4}canvas{width:100%;height:220px;display:block;touch-action:pan-y;cursor:crosshair}.chart-detail{min-height:54px;margin-top:8px;padding:10px 12px;border-radius:10px;background:#f2f5f8;font-size:13px;line-height:1.65}.chart-detail strong{font-size:16px}.chart-tip{color:#64748b;font-size:12px;margin-top:5px}.hidden{display:none}.checkselect{width:20px;height:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.caption{font-size:12px;color:#66778a;line-height:1.5}hr{border:0;border-top:1px solid #e5eaf0;margin:15px 0}

</style></head><body><main><header><div><small>PERSONAL FINANCE</small><h1>たくわえ</h1></div><span class="pill">ローカル保存</span></header><div id="view"></div><div class="foot">銀行との自動連携はありません。金額は入力した記録をもとに計算します。銀行明細との照合とバックアップを定期的に行ってください。</div></main><nav class="nav"><div class="home-switch seg" id="home-switch" hidden aria-label="ホーム内の表示切り替え"></div><div class="nav-inner" id="nav"></div></nav><script>
const KEY='takuwae-v1';const names={s1:'三井住友①',r:'りそな',s2:'三井住友②',cash:'現金財布',em:'電子マネー'};const seedBills=[['rent','家賃','r'],['parking','駐車場','s1'],['insurance','傷害保険','s1'],['phone','携帯電話','s1'],['chat','ChatGPT','s1'],['adobe','Adobe','s1'],['youtube','YouTube',''],['weather','ウェザーニュース',''],['prime','Amazonプライム','']].map(([id,name,bank])=>({id,name,bank,active:true}));
const today=()=>new Date().toLocaleDateString('sv-SE');const ym=()=>new Date().toLocaleDateString('sv-SE').slice(0,7);const fresh=()=>({initial:{s1:0,r:0,s2:0,cash:0,em:0},fundInitial:{repair:0,car:0},fundCategories:[{id:'repair',name:'修理予備費',goal:300000},{id:'car',name:'車両購入資金',goal:0}],bills:seedBills,months:{},tx:[],monthly:30000,bonus:150000,payday:25,weeklyBuffer:0});let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){db=fresh()}if(!Array.isArray(db.fundCategories))db.fundCategories=fresh().fundCategories;const ui={tab:'home',type:'expense',edit:false,selected:[],add:false,withdrawStep:0,wd:{fund:'repair',amount:'',reason:'フレアの修理',to:'s1'},filter:'all',month:ym(),addFund:false,deleteFund:null,editTx:null,billNotice:null};const fmt=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);let save=()=>localStorage.setItem(KEY,JSON.stringify(db));const month=()=>db.months[ui.month]??(db.months[ui.month]={});const billState=b=>month()[b.id]??(month()[b.id]={amount:'',paid:false,bank:b.bank});const activeBills=()=>db.bills.filter(b=>b.active!==false&&(!b.end||ui.month<b.end)&&(!b.start||ui.month>=b.start));const balances=()=>{const a={...db.initial};for(const t of db.tx){if(t.kind==='income')a[t.to]=(a[t.to]||0)+t.amount;else if(t.kind==='expense') {if(t.settled)a[t.from]=(a[t.from]||0)-t.amount;}else {a[t.from]=(a[t.from]||0)-t.amount;a[t.to]=(a[t.to]||0)+t.amount;}}return a};const fundName=k=>db.fundCategories.find(f=>f.id===k)?.name||k;const funds=()=>{const a={...db.fundInitial};for(const t of db.tx){if(t.kind==='saving')a[t.purpose]=(a[t.purpose]||0)+t.amount;if(t.kind==='withdraw')a[t.purpose]=(a[t.purpose]||0)-t.amount;}return a};const options=(selected,includeEmpty=false,subset=Object.keys(names))=>(includeEmpty?'<option value="">支払元</option>':'')+subset.map(k=>`<option value="${k}" ${selected===k?'selected':''}>${names[k]}</option>`).join('');const totalBill=()=>activeBills().reduce((s,b)=>s+(billState(b).paid?Number(billState(b).amount)||0:0),0);const pending=()=>activeBills().filter(b=>!billState(b).paid).reduce((s,b)=>s+(Number(billState(b).amount)||0),0);const unknown=()=>activeBills().filter(b=>!billState(b).amount).length;const moneyColor=k=>({expense:'navy',income:'green',saving:'blue',withdraw:'amber',transfer:'muted'}[k]||'muted');const titleKind=k=>({expense:'出金',income:'入金',saving:'積立',withdraw:'取り崩し',transfer:'振替'}[k]);function record(t){db.tx.unshift({id:id(),date:today(),...t});save();render()};function setTab(t){ui.tab=t;ui.withdrawStep=0;render()};function nav(){document.getElementById('nav').innerHTML=['home:ホーム','entry:入出金','bills:固定費','saving:積立','history:履歴','settings:設定'].map(s=>{const [k,n]=s.split(':');return `<button class="${ui.tab===k?'active':''}" onclick="setTab('${k}')">${n}</button>`}).join('')};
function home(){const a=balances(),f=funds(),unknowns=unknown();const unpaid=pending();const reserveNeeded=Math.max(0,300000-f.repair);const all=Object.values(a).reduce((x,y)=>x+y,0);const pendingCards=db.tx.filter(t=>t.kind==='expense'&&!t.settled).reduce((x,t)=>x+t.amount,0);const monthSaved=db.tx.filter(t=>t.kind==='saving'&&t.purpose==='car'&&String(t.date||'').slice(0,7)===ym()).reduce((sum,t)=>sum+Number(t.amount||0),0);const savingToProtect=Math.max(0,Number(db.monthly||0)-monthSaved);const free=Math.max(0,a.r-unpaid-pendingCards-db.weeklyBuffer-savingToProtect);const weekly=Math.floor(free/4);return `<div class="hero"><small>今週あと使えるお金 · 暫定目安</small><div class="big">${fmt(weekly)}</div><div class="progress"><div style="width:${Math.min(100,Math.max(0,weekly/30000*100))}%"></div></div><p class="caption">りそなの帳簿残高から、未払いの入力済み固定費・後払い予定・生活費確保額・今月の未積立予定額 ${fmt(savingToProtect)} を差し引き、4等分した簡易試算。積立が三井住友①から行われる場合も安全側に控除する暫定方式。</p>${unknowns?`<div class="notice">金額未入力の固定費が${unknowns}件あるため、使える額は確定してへんで。</div>`:''}</div><div class="card"><h3>口座・財布の残高</h3>${Object.keys(names).map(k=>`<div class="row entry"><span>${names[k]}</span><strong>${fmt(a[k])}</strong></div>`).join('')}<div class="row" style="margin-top:12px"><b>帳簿上の資産合計</b><b>${fmt(all)}</b></div></div><div class="grid"><div class="card"><small>修理予備費</small><strong class="blue" style="display:block;font-size:21px">${fmt(f.repair)}</strong><small>目標まであと${fmt(reserveNeeded)}</small></div><div class="card"><small>車両購入資金</small><strong class="blue" style="display:block;font-size:21px">${fmt(f.car)}</strong><small>毎月${fmt(db.monthly)}目標</small></div></div><button style="width:100%" onclick="setTab('entry')">＋ 入出金を記録</button><p class="caption">※三井住友②の用途別合計 ${fmt(f.repair+f.car)} ／ 実残高 ${fmt(a.s2)}。差額 ${fmt(a.s2-f.repair-f.car)} は未分類資金として扱う。</p>`}
function entry(){
const types=[['expense','出金'],['income','入金'],['saving','積立'],['transfer','振替']];
const current=types.find(x=>x[0]===ui.type)?.[1]||'出金';
const buttons=types.map(([k,v])=>'<button type="button" class="tx-kind tx-'+k+(ui.type===k?' selected':'')+'" aria-pressed="'+(ui.type===k)+'" onclick="ui.type=\''+k+'\';render()">'+v+'</button>').join('');
const source=ui.type==='income'?'入金先':'支払い元・振替元';
const extra=ui.type==='expense'?'<div class="field"><label>支出区分</label><select name="category">'+['コンビニ','スーパー','ネット','食費','日用品','燃料費','趣味・娯楽','その他'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>支払い方法</label><select name="method"><option value="instant">即時払い</option><option value="credit">クレジットカード（後払い）</option></select></div>':ui.type==='income'?'<div class="field"><label>入金区分</label><select name="category"><option>給与</option><option>ボーナス</option><option>返金</option><option>その他</option></select></div>':'';
const destination=['saving','transfer'].includes(ui.type)?'<div class="field"><label>振替先</label><select name="to">'+options('s2')+'</select></div>':'';
const purpose=ui.type==='saving'?'<div class="field"><label>積立用途</label><select name="purpose">'+db.fundCategories.map(f=>'<option value="'+esc(f.id)+'">'+esc(f.name)+'</option>').join('')+'</select></div>':'';
return '<div class="card"><h2>入出金を記録</h2><form id="txform" onsubmit="submitTx(event)"><div class="tx-layout"><div class="tx-fields"><div class="field"><label>金額（円）</label><input name="amount" inputmode="numeric" type="number" min="1" step="1" required placeholder="¥ 0"></div>'+extra+'<div class="field"><label>'+source+'</label><select name="from">'+options(ui.type==='income'?'s1':ui.type==='saving'?'s1':'r')+'</select></div>'+destination+purpose+'<div class="field"><label>メモ（任意）</label><input name="note" placeholder="内容を入力"></div></div><div class="tx-actions">'+buttons+'<button type="submit" class="tx-submit">記録する<small>'+current+'を登録</small></button></div></div><div class="tx-date field"><label>日付</label><input name="date" type="date" value="'+today()+'" required></div></form><p class="caption" style="margin-top:12px">右側で取引の種類を選び、左側に金額などを入力してな。</p></div>';
}
function submitTx(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const n=Number(d.amount);if(!(n>0))return;let t={kind:ui.type,amount:n,date:d.date,note:d.note||'',category:d.category||titleKind(ui.type)};if(ui.type==='income'){t.to=d.from}else if(ui.type==='expense'){t.from=d.from;t.settled=d.method!=='credit';t.method=d.method}else{if(d.from===d.to)return alert('振替元と振替先は別にしてな');if(ui.type==='saving'&&d.to!=='s2')return alert('積立先は三井住友②にしてな');if(ui.type==='saving'&&d.from==='s2')return alert('同じ貯蓄口座内の用途変更は設定から行ってな');t.from=d.from;t.to=d.to;t.purpose=d.purpose}if(['saving','transfer'].includes(ui.type)&&balances()[t.from]<n)return alert('振替元の帳簿残高が不足してるで。先に残高を確認してな');record(t);ui.tab='history';render()}
function billsView(){const bs=activeBills();return `<div class="row" style="margin-bottom:10px"><h2>固定費管理</h2><button class="secondary" onclick="ui.edit=!ui.edit;ui.selected=[];render()">${ui.edit?'完了':'編集'}</button></div><div class="hero"><small>今月の引き落とし確認済み合計</small><div class="big navy">−${fmt(totalBill())}</div><small>${bs.filter(b=>billState(b).paid).length}/${bs.length}件確認済み · ${ui.month}</small></div><div class="card"><div class="field" style="margin-bottom:12px"><label>表示月</label><input type="month" value="${ui.month}" onchange="ui.month=this.value;ui.edit=false;render()"></div>${bs.map(b=>{const s=billState(b);return `<div class="bill"><div class="row">${ui.edit?`<input class="checkselect" type="checkbox" onchange="toggleSelect('${b.id}',this.checked)">`:''}<b style="flex:1">${esc(b.name)}</b><small>${s.paid?'確認済み':'未確認'}</small></div>${!ui.edit?`<div class="bill-fields"><select aria-label="支払元" onchange="changeBill('${b.id}','bank',this.value)">${options(s.bank,true,['s1','r','s2'])}</select><label class="tick"><input type="checkbox" data-bill-id="${b.id}" aria-label="${esc(b.name)}の引落確認" ${s.paid?'checked':''} onchange="confirmBill('${b.id}',this.checked)"></label><input aria-label="金額" type="number" min="0" placeholder="金額" value="${esc(s.amount)}" oninput="changeBillAmount('${b.id}',this.value)"></div>${ui.billNotice===b.id?`<div class="bill-hint" role="alert">支払元口座と金額を入力してから確認してな。</div>`:''}`:''}</div>`}).join('')}${ui.edit?`<button class="danger" style="width:100%;margin-top:12px" onclick="scheduleDelete()">選択項目を翌月から削除</button>`:''}</div><div class="card"><button class="secondary" style="width:100%" onclick="ui.add=!ui.add;render()">＋ 固定費を追加</button>${ui.add?`<form class="stack" style="margin-top:14px" onsubmit="addBill(event)"><div class="field"><label>名称</label><input name="name" required></div><div class="field"><label>支払元</label><select name="bank">${options('s1',false,['s1','r','s2'])}</select></div><div class="actions"><button class="secondary" type="button" onclick="ui.add=false;render()">キャンセル</button><button>当月から追加</button></div></form>`:''}</div><p class="caption">追加は当月から、削除は翌月から反映。月ごとの金額は空欄で始まるで。固定費の確認取消や金額訂正は帳簿の記録と連動する。</p>`}
function changeBillAmount(bid,val){const b=db.bills.find(x=>x.id===bid),st=billState(b);if(st.paid)return;st.amount=val;save();const tick=document.querySelector('input[data-bill-id="'+bid+'"]');if(tick)tick.disabled=false};function changeBill(bid,field,val){const b=db.bills.find(x=>x.id===bid),s=billState(b);if(s.paid){if(!confirm('確認済みの記録を取り消して編集する？'))return;unconfirm(bid)}s[field]=val;ui.billNotice=null;save();render()};function unconfirm(bid){const s=month()[bid];if(s)s.paid=false;db.tx=db.tx.filter(t=>t.billKey!==ui.month+':'+bid)};function confirmBill(bid,checked){const b=db.bills.find(x=>x.id===bid),s=billState(b);if(checked){if(!(Number(s.amount)>0)||!s.bank){ui.billNotice=bid;render();return;}ui.billNotice=null;db.tx=db.tx.filter(t=>t.billKey!==ui.month+':'+bid);db.tx.unshift({id:id(),kind:'expense',from:s.bank,amount:Number(s.amount),date:today(),category:b.name,settled:true,billKey:ui.month+':'+bid});s.paid=true}else{unconfirm(bid)}ui.billNotice=null;save();render()};function toggleSelect(id,on){ui.selected=on?[...ui.selected,id]:ui.selected.filter(x=>x!==id)};function scheduleDelete(){if(!ui.selected.length)return alert('削除する項目を選んでな');if(!confirm('選択した固定費を翌月から一覧から外す？ 過去の履歴は残るで。'))return;const [y,m]=ui.month.split('-').map(Number),next=`${m===12?y+1:y}-${String(m===12?1:m+1).padStart(2,'0')}`;for(const b of db.bills)if(ui.selected.includes(b.id))b.end=next;ui.edit=false;ui.selected=[];save();render()};function addBill(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));db.bills.push({id:id(),name:d.name.trim(),bank:d.bank,start:ui.month,active:true});ui.add=false;save();render()}
function savingView(){const f=funds();return `<h2>積立・将来の見通し</h2><div class="grid">${db.fundCategories.map(x=>`<div class="card"><small>${esc(x.name)}</small><strong class="blue" style="display:block;font-size:20px">${fmt(f[x.id]||0)}</strong><small>${x.goal?'目標 '+fmt(x.goal):'用途別積立'}</small></div>`).join('')}</div><div class="card"><div class="row"><h3>積立項目の管理</h3><button class="secondary" onclick="ui.addFund=!ui.addFund;render()">＋ 項目を追加</button></div>${ui.addFund?`<form class="stack" onsubmit="addFund(event)" style="padding:12px 0"><div class="field"><label>積立項目名</label><input name="fundName" placeholder="例：旅行資金" maxlength="40" required></div><div class="field"><label>目標金額（円・任意）</label><input name="fundGoal" type="number" min="0" step="1" placeholder="未設定なら0"></div><div class="actions"><button type="button" class="secondary" onclick="ui.addFund=false;render()">キャンセル</button><button type="submit">追加する</button></div></form>`:''}${db.fundCategories.map(x=>`<div class="row entry"><span>${esc(x.name)}</span><span>${!['repair','car'].includes(x.id)?`<button class="outline" style="padding:6px 9px" onclick="ui.deleteFund='${x.id}';render()">削除</button>`:''}</span></div>`).join('')}${ui.deleteFund?`<div class="notice"><b>${esc(fundName(ui.deleteFund))}を削除する？</b><p>残高0円の項目だけ削除できるで。取引履歴は残す。</p><div class="actions"><button class="secondary" onclick="ui.deleteFund=null;render()">キャンセル</button><button class="danger" onclick="removeFund(ui.deleteFund)">削除を確定</button></div></div>`:""}<p class="caption">追加した項目は「入出金 → 積立」から選べるで。残高が0円なら削除できるで。過去の履歴は保持する。</p></div><div class="card"><h3>資金推移グラフ</h3><canvas id="chart" width="700" height="320" aria-label="積立資金の推移グラフ。点をタップすると日付と金額を表示"></canvas><div id="chart-detail" class="chart-detail" aria-live="polite">グラフの点をタップすると、年月日と金額が表示されるで。</div><p class="chart-tip">青：車両購入資金 ／ 緑：修理予備費 ／ その他：追加項目</p><p class="caption">追加項目は将来の積立額が未設定のため、現状維持で表示するで。</p></div><div class="card stack"><div class="field"><label>毎月の車両購入積立目標</label><input type="number" value="${db.monthly}" onchange="db.monthly=Number(this.value)||0;save();render()"></div><div class="field"><label>車両購入向けボーナス積立（1回分）</label><input type="number" value="${db.bonus}" onchange="db.bonus=Number(this.value)||0;save();render()"></div><p class="caption">2027年夏は修理予備費へ20万円を補填する計画。</p><div class="actions"><button onclick="ui.type='saving';setTab('entry')">積立を記録</button><button class="secondary" onclick="setTab('withdraw')">資金を取り崩す</button></div></div>`}
function addFund(event){event.preventDefault();const form=event.currentTarget;const n=form.elements.fundName.value.trim();const raw=form.elements.fundGoal.value;const goal=raw===''?0:Number(raw);if(!n||n.length>40)return alert('1〜40文字で入力してな');if(db.fundCategories.some(x=>x.name===n))return alert('同じ名前があるで');if(!Number.isSafeInteger(goal)||goal<0)return alert('0以上の整数で入力してな');db.fundCategories.push({id:'fund_'+id(),name:n,goal});ui.addFund=false;save();render()}
function removeFund(fid){if(['repair','car'].includes(fid))return;if((funds()[fid]||0)!==0)return alert('残高がある項目は削除できへん');db.fundCategories=db.fundCategories.filter(x=>x.id!==fid);ui.deleteFund=null;if(!db.tx.some(t=>t.purpose===fid))delete db.fundInitial[fid];save();render()}
function drawChart(){
 const el=document.getElementById('chart');if(!el)return;
 const c=el.getContext('2d'),w=700,h=320;const f=funds();
 const car=f.car,repair=f.repair;
 const vals=[car,car+db.monthly*12+db.bonus,car+db.monthly*24+db.bonus*3,car+db.monthly*36+db.bonus*5];
 const max=Math.max(300000,...vals,repair,...db.fundCategories.map(x=>f[x.id]||0))*1.18;
 const xs=[55,245,440,635],yy=v=>270-v/max*235;
 const base=new Date();base.setHours(12,0,0,0);
 const dates=xs.map((_,i)=>{const d=new Date(base);d.setFullYear(base.getFullYear()+i);return d.getFullYear()+'年'+String(d.getMonth()+1).padStart(2,'0')+'月'+String(d.getDate()).padStart(2,'0')+'日'});
 const points=[];
 c.clearRect(0,0,w,h);c.strokeStyle='#dfe6ed';c.lineWidth=1;
 for(let i=0;i<5;i++){const y=270-i*235/4;c.beginPath();c.moveTo(50,y);c.lineTo(650,y);c.stroke();c.fillStyle='#738396';c.font='15px sans-serif';c.fillText(Math.round(max*i/4/10000)+'万',2,y+4)}
 function series(values,color,label){c.strokeStyle=color;c.lineWidth=4;c.beginPath();values.forEach((v,i)=>i?c.lineTo(xs[i],yy(v)):c.moveTo(xs[i],yy(v)));c.stroke();values.forEach((v,i)=>{const y=yy(v);c.beginPath();c.arc(xs[i],y,7,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.strokeStyle=color;c.lineWidth=3;c.stroke();points.push({x:xs[i],y,value:v,date:dates[i],label,forecast:i>0})})}
 series(vals,'#3478d4','車両購入資金');series(xs.map(()=>repair),'#32815c','修理予備費');db.fundCategories.filter(x=>!['car','repair'].includes(x.id)).forEach((x,i)=>series(xs.map(()=>f[x.id]||0),['#9b681e','#8559a6','#bd607c','#477e88'][i%4],x.name));
 c.fillStyle='#52657a';c.font='15px sans-serif';['現在','1年後','2年後','3年後'].forEach((t,i)=>c.fillText(t,xs[i]-24,300));
 c.fillStyle='#3478d4';c.fillText('● 車両購入資金（計画）',65,20);c.fillStyle='#32815c';c.fillText('● 修理予備費（現状維持）',370,20);
 const detail=document.getElementById('chart-detail');
 function selectPoint(e){const rect=el.getBoundingClientRect();const x=(e.clientX-rect.left)*w/rect.width,y=(e.clientY-rect.top)*h/rect.height;let best=null,dist=Infinity;for(const p of points){const d=Math.hypot(p.x-x,p.y-y);if(d<dist){dist=d;best=p}}if(!best||dist>45)return;detail.innerHTML='<strong>'+best.date+'</strong><div style="color:'+(best.label==='車両購入資金'?'#3478d4':best.label==='修理予備費'?'#32815c':'#9b681e')+'">'+best.label+'：'+fmt(best.value)+'</div><small>'+(best.forecast?'将来の計画値・試算':'現在の帳簿上の残高')+'</small>'}
 el.addEventListener('pointerdown',selectPoint);el.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')selectPoint(e)});
}
function withdrawView(){const f=funds(),wd=ui.wd,n=Number(wd.amount)||0,valid=n>0&&n<=f[wd.fund];return `<h2>資金の取り崩し</h2><div class="card stack">${ui.withdrawStep===0?`<div class="field"><label>取り崩す資金</label><select onchange="ui.wd.fund=this.value;render()">${db.fundCategories.map(x=>`<option value="${x.id}" ${wd.fund===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="stat"><small>現在の用途別残高</small><strong class="blue">${fmt(f[wd.fund])}</strong></div><div class="field"><label>金額</label><input type="number" min="1" placeholder="金額" value="${esc(wd.amount)}" oninput="ui.wd.amount=this.value;document.getElementById('after').textContent='取り崩し後 '+fmt(${f[wd.fund]}-Number(this.value||0))"></div><small id="after">取り崩し後 ${fmt(f[wd.fund]-n)}</small><div class="field"><label>用途</label><select onchange="ui.wd.reason=this.value">${['フレアの修理','車検・整備','生活費の不足','予定外の買い物','その他'].map(x=>`<option ${wd.reason===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>移動先</label><select onchange="ui.wd.to=this.value">${['s1','r','cash'].map(x=>`<option value="${x}" ${wd.to===x?'selected':''}>${names[x]}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="cancelWd()">キャンセル</button><button onclick="nextWd()">内容を確認</button></div>`:ui.withdrawStep===1?`<h3>取り崩し内容の確認</h3><div class="row"><span>対象</span><b>${fundName(wd.fund)}</b></div><div class="row"><span>金額</span><b>${fmt(n)}</b></div><div class="row"><span>移動先</span><b>${names[wd.to]}</b></div><div class="row"><span>用途</span><b>${esc(wd.reason)}</b></div><div class="actions"><button class="secondary" onclick="ui.withdrawStep=0;render()">戻って修正</button><button onclick="ui.withdrawStep=${wd.fund==='car'?2:3};render()">${wd.fund==='car'?'次へ':'取り崩しを確定'}</button></div><button class="outline" onclick="cancelWd()">キャンセル</button>`:ui.withdrawStep===2?`<div class="notice"><b>購入資金の取り崩し・最終確認</b><p>将来の車両購入資金が ${fmt(f.car)} から ${fmt(f.car-n)} に減るで。それでも取り崩す？</p></div><div class="actions"><button class="secondary" onclick="cancelWd()">キャンセル</button><button class="danger" onclick="ui.withdrawStep=3;render()">それでも取り崩す</button></div>`:`<h3>最終確定</h3><p>この操作は銀行への送金ではなく、実際に移動した資金を帳簿へ記録する操作やで。</p><div class="actions"><button class="secondary" onclick="cancelWd()">キャンセル</button><button onclick="commitWd()">記録を確定</button></div>`}</div>`};function nextWd(){const f=funds(),n=Number(ui.wd.amount);if(!(n>0)||n>f[ui.wd.fund])return alert('取り崩し額が残高を超えているで');if(balances().s2<n)return alert('三井住友②の帳簿残高が不足してるで');ui.withdrawStep=1;render()};function cancelWd(){ui.withdrawStep=0;ui.wd={fund:'repair',amount:'',reason:'フレアの修理',to:'s1'};setTab('saving')};function commitWd(){const f=funds(),w=ui.wd,n=Number(w.amount);if(!(n>0)||n>f[w.fund]||balances().s2<n)return alert('残高を再確認してな');record({kind:'withdraw',from:'s2',to:w.to,amount:n,purpose:w.fund,category:w.reason});ui.withdrawStep=0;ui.wd={fund:'repair',amount:'',reason:'フレアの修理',to:'s1'};setTab('history')}
let historyMonth='all';
function historyView(){const tx=db.tx.filter(t=>(historyMonth==='all'||String(t.date||'').slice(0,7)===historyMonth)&&(ui.filter==='all'||t.kind===ui.filter));return `<h2>入出金履歴</h2><div class="card"><label>表示月</label><input type="month" value="${historyMonth==='all'?'':historyMonth}" onchange="historyMonth=this.value||'all';ui.editTx=null;render()"><button class="secondary" type="button" style="margin:8px 0" onclick="historyMonth='all';render()">全期間を表示</button><select onchange="ui.filter=this.value;render()">${[['all','すべて'],['expense','出金'],['income','入金'],['saving','積立'],['withdraw','取り崩し'],['transfer','振替']].map(([v,n])=>`<option value="${v}" ${ui.filter===v?'selected':''}>${n}</option>`).join('')}</select>${tx.length?tx.map(t=>`<div class="entry"><div class="row"><div style="min-width:0;flex:1"><b>${esc(t.category||titleKind(t.kind))}</b><div class="muted">${esc(t.date)} · ${t.from?names[t.from]+' → ':''}${t.to?names[t.to]:''}${t.settled===false?' · 引落待ち':''}</div>${t.recordedAt?`<div class="original-time">${new Date(t.recordedAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div>`:(t.method==='instant'?'<div class="muted">時刻記録なし</div>':'')}</div><strong class="${moneyColor(t.kind)}">${t.kind==='expense'?'−':t.kind==='income'||t.kind==='saving'?'+':''}${fmt(t.amount)}</strong></div><div class="actions" style="margin-top:9px">${t.rolloverPeriod?'<span class="pill">給与期間精算に連動・個別訂正不可</span>':''}<button ${t.rolloverPeriod?'disabled title="精算単位で訂正してな"':''} class="secondary" type="button" onclick="ui.editTx=ui.editTx==='${t.id}'?null:'${t.id}';render()">${ui.editTx===t.id?'閉じる':'訂正・取消'}</button>${t.settled===false?`<button type="button" onclick="settleTx('${t.id}')">引落確認</button>`:''}</div>${ui.editTx===t.id?`<form class="stack" style="margin-top:12px" onsubmit="editTransaction(event,'${t.id}')"><div class="field"><label>金額（円）</label><input name="amount" type="number" min="1" step="1" required value="${t.amount}"></div><div class="field"><label>日付</label><input name="date" type="date" required value="${esc(t.date)}"></div><div class="field"><label>項目・内容</label><input name="category" maxlength="80" required value="${esc(t.category||titleKind(t.kind))}" onfocus="this.select()" onclick="this.select()"></div>${t.kind==='expense'?`<div class="field"><label>支払元</label><select name="from">${Object.entries(names).filter(([k])=>k!=='s2').map(([k,n])=>`<option value="${k}" ${t.from===k?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`:''}<div class="field"><label>メモ</label><input name="note" value="${esc(t.note||'')}"></div><div class="actions"><button type="button" class="secondary" onclick="ui.editTx=null;render()">戻る</button><button type="submit">訂正を保存</button></div><button type="button" class="danger" onclick="ui.editTx='delete:${t.id}';render()">この記録を取り消す</button></form>`:''}${ui.editTx==='delete:'+t.id?`<div class="notice"><b>この記録を取り消す？</b><p>帳簿の残高と積立残高を再計算するで。実際の銀行取引は取り消されへん。</p><div class="actions"><button class="secondary" onclick="ui.editTx=null;render()">キャンセル</button><button class="danger" onclick="deleteTransaction('${t.id}')">取消を確定</button></div></div>`:''}</div>`).join(''):'<p class="muted">まだ記録がないで。</p>'}</div>`}
function settleTx(tid){const t=db.tx.find(x=>x.id===tid);if(!t||t.settled!==false)return;t.settled=true;save();render()}
function editTransaction(e,tid){e.preventDefault();const t=db.tx.find(x=>x.id===tid);if(!t)return;if(t.rolloverPeriod)return alert('給与期間の精算に紐づく取引は個別に訂正できへん。精算記録から処理してな');const d=Object.fromEntries(new FormData(e.target));const n=Number(d.amount);if(!Number.isSafeInteger(n)||n<=0)return alert('正しい金額を入力してな');const category=String(d.category||'').trim();if(!category||category.length>80)return alert('項目・内容は80文字以内で入力してな');if(t.kind==='expense'&&d.from){if(!['r','s1','cash','em'].includes(d.from))return alert('支払元を確認してな');if(t.billKey&&d.from!==t.from)return alert('固定費に紐づく記録の支払元は、固定費側から変更してな');t.from=d.from}t.amount=n;t.date=d.date;t.category=category;t.note=d.note||'';if(t.billKey){const [m,...parts]=t.billKey.split(':');const st=db.months[m]?.[parts.join(':')];if(st)st.amount=String(n)}ui.editTx=null;save();render()}
function deleteTransaction(tid){const t=db.tx.find(x=>x.id===tid);if(!t)return;if(t.rolloverPeriod)return alert('給与期間の精算に紐づく取引は個別に訂正できへん。精算記録から処理してな');if(t.billKey){const [m,...parts]=t.billKey.split(':');const st=db.months[m]?.[parts.join(':')];if(st)st.paid=false}db.tx=db.tx.filter(x=>x.id!==tid);ui.editTx=null;save();render()}

function commitRollover(event){
 event.preventDefault();
 const data=Object.fromEntries(new FormData(event.currentTarget)),total=Number(data.total),saving=Number(data.saving),cash=Number(data.cash);

 if(saving&&!db.fundCategories.some(x=>x.id===data.purpose))return alert('積立先を選び直してな');
 const snap=db.closingSnapshots[period];if(snap?.confirmed&&total!==snap.amount)return alert('24日に確定した締め額と一致せえへん。確認してな');if(snap?.confirmed&&snap.txSignature&&snap.txSignature!==closingTxSignature(period))return alert('24日の締め確定後に過去の取引が変わっているで。締め額を再確認してな');

 if(!confirm('前期間の余剰金 '+fmt(total)+' を精算するで。\n積立 '+fmt(saving)+'、現金 '+fmt(cash)+'、翌月繰越 '+fmt(carry)+'。\n積立と現金引き出しは実行済みで間違いない？'))return;

 if(cash)db.tx.unshift({id:id(),rolloverPeriod:period,kind:'transfer',date:stamp,amount:cash,from:'r',to:'cash',category:'給与期間余剰金の現金引出',note:'給与期間 '+period+' 精算'});
 db.rollovers[period]={total,saving,cash,carry,purpose:data.purpose,recordedAt:stamp};

function cancelRollover(period=rolloverPeriod()){
 const r=db.rollovers[period];
 if(!r)return alert('精算記録がないで');
 const linked=db.tx.filter(t=>t.rolloverPeriod===period);
 // Older test records lack linkage; do not guess which transactions belong to them.
 if((r.saving>0&&!linked.some(t=>t.kind==='saving'))||(r.cash>0&&!linked.some(t=>t.kind==='transfer')))return alert('旧形式の精算記録は自動取消できへん。データを確認してな');
 const expected=(r.saving>0?1:0)+(r.cash>0?1:0);
 if(linked.length!==expected)return alert('精算取引の件数が合わへん。自動取消を中止するで');
 if(linked.some(t=>t.kind==='saving'&&(t.amount!==r.saving||t.purpose!==r.purpose||t.from!=='r'||t.to!=='s2'))||linked.some(t=>t.kind==='transfer'&&(t.amount!==r.cash||t.from!=='r'||t.to!=='cash')))return alert('精算内容と取引が一致せえへん。自動取消を中止するで');
 const remaining=balances(),fund=funds();
 for(const t of linked){if(t.kind==='saving'&&(remaining.s2<t.amount||fund[t.purpose]<t.amount))return alert('積立先の残高が不足しているため取消できへん');if(t.kind==='transfer'&&remaining.cash<t.amount)return alert('現金財布の残高が不足しているため取消できへん')}
 if(!confirm('精算全体を取り消す？ 積立・現金への移動記録を帳簿上で逆算するで。実際の銀行取引は取り消されへん。'))return;
 db.tx=db.tx.filter(t=>t.rolloverPeriod!==period);
 delete db.rollovers[period];
 save();render();
}
function reviseClosingAmount(){

 const period=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
 if(db.rollovers[period])return alert('精算済みやで');
 const snap=db.closingSnapshots[period];if(!snap?.confirmed)return;
 if(!confirm('締め額の確定を解除して、最新の帳簿残高で再計算する？'))return;
 snap.confirmed=false;snap.provisional=true;
 save();snapshotOn24();render();
}

 if(!snap?.confirmed)return alert('確定済みの締め額がないで');
 if(!confirm('締め額の確定を解除する？ 前期間の余剰金は明細と照合して手入力してな。'))return;
 snap.confirmed=false;snap.provisional=true;snap.reopenedAt=new Date().toISOString();
 save();render();
}
function historyRolloverView(){
 const keys=Object.keys(db.rollovers).sort().reverse();
 if(!keys.length)return '';
 return '<div class="card"><h3>過去の給与期間精算</h3>'+keys.map(k=>{const r=db.rollovers[k];return '<div class="entry"><div class="row"><b>'+esc(k)+'</b><b>'+fmt(r.total)+'</b></div><p class="caption">積立 '+fmt(r.saving)+'／現金 '+fmt(r.cash)+'／繰越 '+fmt(r.carry)+'</p><button class="secondary" onclick="cancelRollover(\''+esc(k)+'\')">この期間の精算全体を取り消す</button></div>'}).join('')+'</div>';
}
function closingTxSignature(period){
 const [year,month]=period.split('-').map(Number),pay=Math.max(2,Math.min(28,Number(db.payday)||25));
 const end=new Date(year,month-1,pay-1,23,59,59);
 return JSON.stringify(db.tx.filter(t=>t.date&&new Date(t.date+'T12:00:00')<=end&&!t.rolloverPeriod).map(t=>[t.id,t.kind,t.amount,t.date,t.from,t.to,t.settled]).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))));
}
const homeBeforeRollover=home;
home=function(){return rolloverForm()+historyRolloverView()+homeBeforeRollover()};

/* v1.0 quick entry: existing storage key and ledger are preserved. */
let quickMode='quick',quickCategory='買い物',quickSource='cash',quickAmount='',quickNotice='';
const quickSources=[['cash','現金'],['em','電子マネー'],['s1','三井住友'],['r','りそな']];
const quickCategories=['買い物','食事','支払い','雑費'];
const homeV09=home;
function quickSetCategory(v){if(!quickCategories.includes(v))return;quickCategory=v;render()}
function quickSetSource(v){if(!quickSources.some(x=>x[0]===v))return;quickSource=v;render()}
function quickSetAmount(v){quickAmount=String(v).replace(/[^0-9]/g,'');quickNotice='';const b=document.getElementById('quick-record');if(b)b.disabled=!(Number.isSafeInteger(Number(quickAmount))&&Number(quickAmount)>0);const c=document.getElementById('quick-clear');if(c)c.disabled=!quickAmount}
function quickClear(){quickAmount='';quickNotice='';render()}
let quickBusy=false;
function quickRecord(){
 const n=Number(quickAmount);
 if(quickBusy||!quickAmount||!Number.isSafeInteger(n)||n<=0)return;
 if(!quickCategories.includes(quickCategory)||!quickSources.some(x=>x[0]===quickSource))return;
 quickBusy=true;
 try{
   record({kind:'expense',amount:n,from:quickSource,category:quickCategory,method:'instant',settled:true,note:'',recordedAt:new Date().toISOString()});
   quickAmount='';quickNotice=fmt(n)+' を記録したで';
 }finally{quickBusy=false}
 render();
}
function quickButton(label,selected,fn){
 return '<button type="button" class="quick-choice'+(selected?' chosen':'')+'" onclick="'+fn+'">'+esc(label)+'</button>';
}
function quickEntryView(){
 return '<div class="card quick-panel"><div class="row quick-heading"><b>使った金額</b><button id="quick-clear" type="button" class="secondary quick-clear" onclick="quickClear()" '+(!quickAmount?'disabled':'')+'>× クリア</button></div>'+
 '<div class="quick-amount-row"><div class="quick-amount"><b>¥</b><input aria-label="使った金額" type="number" min="1" step="1" inputmode="numeric" placeholder="0" value="'+esc(quickAmount)+'" oninput="quickSetAmount(this.value)"></div><button id="quick-record" type="button" class="quick-record" onclick="quickRecord()" '+(!(Number.isSafeInteger(Number(quickAmount))&&Number(quickAmount)>0)?'disabled':'')+'>✓ 記録</button></div>'+
 '<h3>支出の種類</h3><div class="quick-grid">'+quickCategories.map(v=>quickButton(v,quickCategory===v,"quickSetCategory('"+v+"')")).join('')+'</div>'+
 '<h3>支払元</h3><div class="quick-grid">'+quickSources.map(([v,label])=>quickButton(label,quickSource===v,"quickSetSource('"+v+"')")).join('')+'</div>'+
 (quickNotice?'<p class="caption" role="status">'+esc(quickNotice)+'</p>':'')+'</div>';
}
home=function(){
 return (quickMode==='quick'?quickEntryView():homeV09());
};
