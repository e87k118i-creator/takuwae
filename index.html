/* v0.9 入出金：手描きレイアウトをもとにした2カラム */
.tx-layout{display:grid;grid-template-columns:minmax(0,1fr) 75px;gap:13px;align-items:start}
.tx-fields{display:grid;gap:13px;min-width:0}

.quick-tabs{margin-top:12px;margin-bottom:12px}.quick-panel h3{margin:16px 0 9px}.quick-heading{justify-content:flex-start;gap:12px;margin-bottom:9px}.quick-clear{padding:5px 9px;font-size:14px}.quick-amount-row{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px}.quick-amount{height:56px;display:flex;align-items:center;gap:5px;border:1px solid #cbd5df;border-radius:11px;padding:0 9px;min-width:0}.quick-amount input{border:0;padding:5px 0;min-width:0;font-size:22px}.quick-record{height:56px;padding:0 5px;background:#397e6c}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick-choice{height:64px;background:#f2f5f8;color:#263a50;border:1px solid #cbd5df;padding:5px}
/* Keep the note closer to the fixed navigation without altering other tabs. */
body:has(.quick-tabs) main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(64px + env(safe-area-inset-bottom))}

/* Two totals remain baseline-aligned even when the labels wrap. */

function submitTx(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const n=Number(d.amount);if(!(n>0))return;let t={kind:ui.type,amount:n,date:d.date,note:d.note||'',category:d.category||titleKind(ui.type)};if(ui.type==='income'){t.to=d.from}else if(ui.type==='expense'){t.from=d.from;t.settled=d.method!=='credit';t.method=d.method}else{if(d.from===d.to)return alert('振替元と振替先は別にしてな');if(ui.type==='saving'&&d.to!=='s2')return alert('積立先は三井住友②にしてな');if(ui.type==='saving'&&d.from==='s2')return alert('同じ貯蓄口座内の用途変更は設定から行ってな');t.from=d.from;t.to=d.to;t.purpose=d.purpose}if(['saving','transfer'].includes(ui.type)&&balances()[t.from]<n)return alert('振替元の帳簿残高が不足してるで。先に残高を確認してな');record(t);ui.tab='history';render()}

function changeBillAmount(bid,val){const b=db.bills.find(x=>x.id===bid),st=billState(b);if(st.paid)return;st.amount=val;save();const tick=document.querySelector('input[data-bill-id="'+bid+'"]');if(tick)tick.disabled=false};function changeBill(bid,field,val){const b=db.bills.find(x=>x.id===bid),s=billState(b);if(s.paid){if(!confirm('確認済みの記録を取り消して編集する？'))return;unconfirm(bid)}s[field]=val;ui.billNotice=null;save();render()};function unconfirm(bid){const s=month()[bid];if(s)s.paid=false;db.tx=db.tx.filter(t=>t.billKey!==ui.month+':'+bid)};function confirmBill(bid,checked){const b=db.bills.find(x=>x.id===bid),s=billState(b);if(checked){if(!(Number(s.amount)>0)||!s.bank){ui.billNotice=bid;render();return;}ui.billNotice=null;db.tx=db.tx.filter(t=>t.billKey!==ui.month+':'+bid);db.tx.unshift({id:id(),kind:'expense',from:s.bank,amount:Number(s.amount),date:today(),category:b.name,settled:true,billKey:ui.month+':'+bid});s.paid=true}else{unconfirm(bid)}ui.billNotice=null;save();render()};function toggleSelect(id,on){ui.selected=on?[...ui.selected,id]:ui.selected.filter(x=>x!==id)};function scheduleDelete(){if(!ui.selected.length)return alert('削除する項目を選んでな');if(!confirm('選択した固定費を翌月から一覧から外す？ 過去の履歴は残るで。'))return;const [y,m]=ui.month.split('-').map(Number),next=`${m===12?y+1:y}-${String(m===12?1:m+1).padStart(2,'0')}`;for(const b of db.bills)if(ui.selected.includes(b.id))b.end=next;ui.edit=false;ui.selected=[];save();render()};function addBill(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));db.bills.push({id:id(),name:d.name.trim(),bank:d.bank,start:ui.month,active:true});ui.add=false;save();render()}

function drawChart(){
 const el=document.getElementById('chart');if(!el)return;
 const c=el.getContext('2d'),w=700,h=320;const f=funds();
 const car=f.car,repair=f.repair;
 const vals=[car,car+db.monthly*12+db.bonus,car+db.monthly*24+db.bonus*3,car+db.monthly*36+db.bonus*5];
 const max=Math.max(300000,...vals,repair,...db.fundCategories.map(x=>f[x.id]||0))*1.18;
 const xs=[55,245,440,635],yy=v=>270-v/max*235;
 const base=new Date();base.setHours(12,0,0,0);
 const dates=xs.map((_,i)=>{const d=new Date(base);d.setFullYear(base.getFullYear()+i);return d.getFullYear()+'年'+String(d.getMonth()+1).padStart(2,'0')+'月'+String(d.getDate()).padStart(2,'0')+'日'});
 const points=[];
 c.clearRect(0,0,w,h);c.strokeStyle='#dfe6ed';c.lineWidth=1;
 for(let i=0;i<5;i++){const y=270-i*235/4;c.beginPath();c.moveTo(50,y);c.lineTo(650,y);c.stroke();c.fillStyle='#738396';c.font='15px sans-serif';c.fillText(Math.round(max*i/4/10000)+'万',2,y+4)}
 function series(values,color,label){c.strokeStyle=color;c.lineWidth=4;c.beginPath();values.forEach((v,i)=>i?c.lineTo(xs[i],yy(v)):c.moveTo(xs[i],yy(v)));c.stroke();values.forEach((v,i)=>{const y=yy(v);c.beginPath();c.arc(xs[i],y,7,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.strokeStyle=color;c.lineWidth=3;c.stroke();points.push({x:xs[i],y,value:v,date:dates[i],label,forecast:i>0})})}
 series(vals,'#3478d4','車両購入資金');series(xs.map(()=>repair),'#32815c','修理予備費');db.fundCategories.filter(x=>!['car','repair'].includes(x.id)).forEach((x,i)=>series(xs.map(()=>f[x.id]||0),['#9b681e','#8559a6','#bd607c','#477e88'][i%4],x.name));
 c.fillStyle='#52657a';c.font='15px sans-serif';['現在','1年後','2年後','3年後'].forEach((t,i)=>c.fillText(t,xs[i]-24,300));
 c.fillStyle='#3478d4';c.fillText('● 車両購入資金（計画）',65,20);c.fillStyle='#32815c';c.fillText('● 修理予備費（現状維持）',370,20);
 const detail=document.getElementById('chart-detail');
 function selectPoint(e){const rect=el.getBoundingClientRect();const x=(e.clientX-rect.left)*w/rect.width,y=(e.clientY-rect.top)*h/rect.height;let best=null,dist=Infinity;for(const p of points){const d=Math.hypot(p.x-x,p.y-y);if(d<dist){dist=d;best=p}}if(!best||dist>45)return;detail.innerHTML='<strong>'+best.date+'</strong><div style="color:'+(best.label==='車両購入資金'?'#3478d4':best.label==='修理予備費'?'#32815c':'#9b681e')+'">'+best.label+'：'+fmt(best.value)+'</div><small>'+(best.forecast?'将来の計画値・試算':'現在の帳簿上の残高')+'</small>'}

 if(d.getDate()!==pay-1)return alert('締め額は給料日前日に確定してな');
 const period=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),n=Number(amount);
 if(!Number.isSafeInteger(n)||n<0)return alert('金額を確認してな');
 if(db.rollovers[period])return alert('精算済みやで');
 if(!confirm('締め額 '+fmt(n)+' を確定する？'))return;
 db.closingSnapshots[period]={...(db.closingSnapshots[period]||{}),amount:n,confirmed:true,provisional:false,confirmedAt:new Date().toISOString(),txSignature:closingTxSignature(period)};
 save();render();
}
const rolloverPeriod=()=>{const d=new Date(),pay=Math.max(1,Math.min(28,Number(db.payday)||25));let y=d.getFullYear(),m=d.getMonth();if(d.getDate()<pay){m--;if(m<0){m=11;y--}}return y+'-'+String(m+1).padStart(2,'0')};
let closeOpen=false;
function toggleClose(){closeOpen=!closeOpen;render()}
function rolloverForm(){
 const d=new Date(),pay=Math.max(2,Math.min(28,Number(db.payday)||25)),period=d.getDate()===pay-1?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'):rolloverPeriod(),closed=db.rollovers[period],a=balances(),snapshot=db.closingSnapshots[period];
 if(d.getDate()===pay-1&&!closed)return '<div class="card"><h3>24日｜余剰金の締め額確定</h3><p class="caption">最後の支出を記録してから確定してな。確定後は自動更新せえへん。</p><div class="field"><label>締め額</label><input id="close-amount" type="number" min="0" step="1" value="'+(snapshot?.amount??0)+'" '+(snapshot?.confirmed?'disabled':'')+'></div>'+(snapshot?.confirmed?'<p>確定済み：'+fmt(snapshot.amount)+'</p><button class="secondary" onclick="reviseClosingAmount()">締め額を訂正</button>':'<button style="margin-top:10px" onclick="confirmClosingAmount(document.getElementById(\'close-amount\').value)">締め額を確定</button>')+'</div>';
 if(d.getDate()<pay&&!closed)return '';
 if(closed)return '<div class="card"><h3>給与期間の精算：'+period+'</h3><p>精算済み：'+fmt(closed.total)+'（積立 '+fmt(closed.saving)+'／現金 '+fmt(closed.cash)+'／翌月繰越 '+fmt(closed.carry)+'）</p><small>処理日時：'+esc(closed.recordedAt)+'</small><p class="caption">精算に紐づく取引は個別編集できへん。訂正が必要なら、精算全体を取り消してやり直してな。</p><button class="danger" onclick="cancelRollover()">精算全体を取り消す</button></div>';
 return '<div class="card"><div class="row"><h3>25日｜前給与期間の余剰金精算</h3><button class="secondary" type="button" onclick="toggleClose()">'+(closeOpen?'閉じる':'精算を開く')+'</button></div><p class="caption">対象期間：'+period+'の給与日を迎えた時点。新しい給与が入金済みなら、前期間の最終余剰金を明細で確認して入力してな。金額は自動確定せえへん。</p>'+
 (snapshot?'<p class="caption">24日記録（'+(snapshot.confirmed?'確定':'暫定')+'）：'+fmt(snapshot.amount)+'。明細と照合してな。</p>'+(snapshot.confirmed?'<button class="secondary" onclick="reopenClosingForReview(\''+period+'\')">締め額の確定を解除</button>':''):'<p class="caption">24日記録なし。後からの自動復元はできへんので明細を確認してな。</p>')+
 (closeOpen?'<form class="stack" onsubmit="commitRollover(event)"><div class="field"><label>前給与期間の最終余剰金（円）</label><input name="total" type="number" min="0" step="1" required value="'+(snapshot?.confirmed?snapshot.amount:'')+'" placeholder="確認した金額"></div><div class="field"><label>積立に回す金額</label><input name="saving" type="number" min="0" step="1" required value="0"></div><div class="field"><label>積立先</label><select name="purpose">'+db.fundCategories.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>現金で引き出す金額</label><input name="cash" type="number" min="0" step="1" required value="0"></div><p class="caption">残額は翌月の生活費へ繰り越す。積立と現金引き出しは、実際に資金を移動した後に記録してな。</p><p class="caption">りそな帳簿残高：'+fmt(a.r)+'。振替は支出として数えへん。</p><div class="actions"><button class="secondary" type="button" onclick="toggleClose()">キャンセル</button><button type="submit">実行済みの内容を記録</button></div></form>':'')+'</div>';
}
function commitRollover(event){
 event.preventDefault();
 const data=Object.fromEntries(new FormData(event.currentTarget)),total=Number(data.total),saving=Number(data.saving),cash=Number(data.cash);
 if(![total,saving,cash].every(n=>Number.isSafeInteger(n)&&n>=0))return alert('金額は0以上の整数で入力してな');
 if(saving+cash>total)return alert('積立と現金の合計が余剰金を超えてるで');
 const period=rolloverPeriod();if(new Date().getDate()<Math.max(2,Math.min(28,Number(db.payday)||25)))return alert('給料日以降に精算してな');if(db.rollovers[period])return alert('この給与期間は精算済みやで');
 if(saving+cash>balances().r)return alert('実際に移動する積立・現金の合計が、りそなの帳簿残高を超えてるで');
 if(saving&&!db.fundCategories.some(x=>x.id===data.purpose))return alert('積立先を選び直してな');
 const snap=db.closingSnapshots[period];if(snap?.confirmed&&total!==snap.amount)return alert('24日に確定した締め額と一致せえへん。確認してな');if(snap?.confirmed&&snap.txSignature&&snap.txSignature!==closingTxSignature(period))return alert('24日の締め確定後に過去の取引が変わっているで。締め額を再確認してな');
 const carry=total-saving-cash;
 if(!confirm('前期間の余剰金 '+fmt(total)+' を精算するで。\n積立 '+fmt(saving)+'、現金 '+fmt(cash)+'、翌月繰越 '+fmt(carry)+'。\n積立と現金引き出しは実行済みで間違いない？'))return;
 const stamp=today();
 if(saving)db.tx.unshift({id:id(),rolloverPeriod:period,kind:'saving',date:stamp,amount:saving,from:'r',to:'s2',purpose:data.purpose,category:'給与期間余剰金の積立',note:'給与期間 '+period+' 精算'});
 if(cash)db.tx.unshift({id:id(),rolloverPeriod:period,kind:'transfer',date:stamp,amount:cash,from:'r',to:'cash',category:'給与期間余剰金の現金引出',note:'給与期間 '+period+' 精算'});
 db.rollovers[period]={total,saving,cash,carry,purpose:data.purpose,recordedAt:stamp};
 if(saving&&data.purpose==='car')delete db.savingMonths[stamp.slice(0,7)];
 save();closeOpen=false;render();
}
snapshotOn24();

function cancelRollover(period=rolloverPeriod()){
 const r=db.rollovers[period];
 if(!r)return alert('精算記録がないで');
 const linked=db.tx.filter(t=>t.rolloverPeriod===period);
 // Older test records lack linkage; do not guess which transactions belong to them.
 if((r.saving>0&&!linked.some(t=>t.kind==='saving'))||(r.cash>0&&!linked.some(t=>t.kind==='transfer')))return alert('旧形式の精算記録は自動取消できへん。データを確認してな');
 const expected=(r.saving>0?1:0)+(r.cash>0?1:0);
 if(linked.length!==expected)return alert('精算取引の件数が合わへん。自動取消を中止するで');
 if(linked.some(t=>t.kind==='saving'&&(t.amount!==r.saving||t.purpose!==r.purpose||t.from!=='r'||t.to!=='s2'))||linked.some(t=>t.kind==='transfer'&&(t.amount!==r.cash||t.from!=='r'||t.to!=='cash')))return alert('精算内容と取引が一致せえへん。自動取消を中止するで');
 const remaining=balances(),fund=funds();
 for(const t of linked){if(t.kind==='saving'&&(remaining.s2<t.amount||fund[t.purpose]<t.amount))return alert('積立先の残高が不足しているため取消できへん');if(t.kind==='transfer'&&remaining.cash<t.amount)return alert('現金財布の残高が不足しているため取消できへん')}
 if(!confirm('精算全体を取り消す？ 積立・現金への移動記録を帳簿上で逆算するで。実際の銀行取引は取り消されへん。'))return;
 db.tx=db.tx.filter(t=>t.rolloverPeriod!==period);
 delete db.rollovers[period];
 save();render();
}
function reviseClosingAmount(){
 const d=new Date(),pay=Math.max(2,Math.min(28,Number(db.payday)||25));
 if(d.getDate()!==pay-1)return alert('締め額の訂正は24日中だけ可能やで');
 const period=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
 if(db.rollovers[period])return alert('精算済みやで');
 const snap=db.closingSnapshots[period];if(!snap?.confirmed)return;
 if(!confirm('締め額の確定を解除して、最新の帳簿残高で再計算する？'))return;
 snap.confirmed=false;snap.provisional=true;
 save();snapshotOn24();render();
}

function reopenClosingForReview(period){
 if(db.rollovers[period])return alert('精算済みの期間やで。先に精算を取り消してな');
 const snap=db.closingSnapshots[period];
 if(!snap?.confirmed)return alert('確定済みの締め額がないで');
 if(!confirm('締め額の確定を解除する？ 前期間の余剰金は明細と照合して手入力してな。'))return;
 snap.confirmed=false;snap.provisional=true;snap.reopenedAt=new Date().toISOString();
 save();render();
}
function historyRolloverView(){
 const keys=Object.keys(db.rollovers).sort().reverse();
 if(!keys.length)return '';
 return '<div class="card"><h3>過去の給与期間精算</h3>'+keys.map(k=>{const r=db.rollovers[k];return '<div class="entry"><div class="row"><b>'+esc(k)+'</b><b>'+fmt(r.total)+'</b></div><p class="caption">積立 '+fmt(r.saving)+'／現金 '+fmt(r.cash)+'／繰越 '+fmt(r.carry)+'</p><button class="secondary" onclick="cancelRollover(\''+esc(k)+'\')">この期間の精算全体を取り消す</button></div>'}).join('')+'</div>';
}
function closingTxSignature(period){
 const [year,month]=period.split('-').map(Number),pay=Math.max(2,Math.min(28,Number(db.payday)||25));
 const end=new Date(year,month-1,pay-1,23,59,59);
 return JSON.stringify(db.tx.filter(t=>t.date&&new Date(t.date+'T12:00:00')<=end&&!t.rolloverPeriod).map(t=>[t.id,t.kind,t.amount,t.date,t.from,t.to,t.settled]).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))));
}

home=function(){return rolloverForm()+historyRolloverView()+homeBeforeRollover()};

/* v36: safe in-app PWA update check. Does not modify financial storage. */
const TAKUWAE_APP_VERSION=74;
let takuwaeUpdateBusy=false;
const settingsViewBeforeUpdate=settingsView;
settingsView=function(){
 return settingsViewBeforeUpdate()+
 '<div class="card stack"><h3>アプリの更新</h3>'+
 '<p class="caption">現在のアプリ：v'+TAKUWAE_APP_VERSION+'。通信して最新版を確認するで。家計の保存データは削除せえへんよ。</p>'+
 '<button type="button" id="takuwae-update-button" onclick="checkTakuwaeUpdate()">最新版を確認して更新</button>'+
 '<p class="caption" id="takuwae-update-status" role="status" aria-live="polite">更新中は画面を閉じず、通信できる状態で操作してな。</p></div>';
};
async function checkTakuwaeUpdate(){
 if(takuwaeUpdateBusy)return;
 takuwaeUpdateBusy=true;
 const btn=document.getElementById('takuwae-update-button'),status=document.getElementById('takuwae-update-status');
 if(btn)btn.disabled=true;
 const announce=message=>{if(status)status.textContent=message;};
 announce('最新版を確認中…');
 try{
  if(!navigator.onLine)throw new Error('オフラインやで。ネット接続を確認してな。');
  const url=new URL('./index.html',location.href);
  url.searchParams.set('_update_check',String(Date.now()));
  const response=await fetch(url.href,{cache:'no-store'});
  if(!response.ok)throw new Error('最新版の取得に失敗したで（HTTP '+response.status+'）。');
  const html=await response.text();
  const match=html.match(/<meta name="takuwae-version" content="([0-9]+)">/);
  if(!match)throw new Error('公開版のバージョンを確認できへんかった。再読み込みはせずに終了するで。');
  const published=Number(match[1]);
  if(published<TAKUWAE_APP_VERSION)throw new Error('公開サーバーが古い版を返しているで。しばらくしてから試してな。');
  if('serviceWorker' in navigator){
   const registration=await navigator.serviceWorker.getRegistration();
   if(registration)await registration.update();
  }
  if(published===TAKUWAE_APP_VERSION){
   announce('v'+published+' が最新やで。表示が古い場合は、アプリを終了して開き直してな。');
   return;
  }
  announce('v'+published+' を取得したで。画面を更新するな。');
  location.replace(url.href);
 }catch(e){
  announce('更新できへんかった：'+(e&&e.message?e.message:String(e))+' 家計データは変更してへんで。');
 }finally{
  takuwaeUpdateBusy=false;
  if(btn)btn.disabled=false;
 }
}



/* v50 date wheel: draft selection remains local until confirmed. */
let txWheelDraft=null;
function txWheelISO(v){const [y,m,d]=v;return String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function txWheelDays(y,m){return new Date(y,m,0).getDate()}
function txWheelOptions(type){
 const d=txWheelDraft,yearNow=new Date().getFullYear();
 if(type==='year')return Array.from({length:yearNow-1990+6},(_,i)=>1990+i);
 if(type==='month')return Array.from({length:12},(_,i)=>i+1);
 return Array.from({length:txWheelDays(d[0],d[1])},(_,i)=>i+1);
}
function txWheelFill(type){
 const col=document.getElementById('tx-wheel-'+type);if(!col)return;
 const pos={year:0,month:1,day:2}[type],options=txWheelOptions(type);
 col.innerHTML='<div class="tx-wheel-spacer"></div>'+options.map(v=>'<div class="tx-wheel-item" data-value="'+v+'" aria-selected="'+(v===txWheelDraft[pos])+'">'+v+(type==='year'?'年':type==='month'?'月':'日')+'</div>').join('')+'<div class="tx-wheel-spacer"></div>';
 col.scrollTop=options.indexOf(txWheelDraft[pos])*44;
}
function txWheelSync(type){
 if(!txWheelDraft)return;
 const col=document.getElementById('tx-wheel-'+type);if(!col)return;
 const vals=txWheelOptions(type),pos={year:0,month:1,day:2}[type];
 const idx=Math.max(0,Math.min(vals.length-1,Math.round(col.scrollTop/44)));
 const next=vals[idx];if(next===undefined)return;
 const old=txWheelDraft[pos];txWheelDraft[pos]=next;
 col.querySelectorAll('.tx-wheel-item').forEach((item,i)=>item.setAttribute('aria-selected',i===idx?'true':'false'));
 if(old!==next&&(type==='year'||type==='month')){
  const max=txWheelDays(txWheelDraft[0],txWheelDraft[1]);
  if(txWheelDraft[2]>max)txWheelDraft[2]=max;
  txWheelFill('day');
 }
}
function openTxDateWheel(){
 const input=document.getElementById('tx-date-value');if(!input)return;
 const parts=input.value.split('-').map(Number);
 if(parts.length!==3||parts.some(x=>!Number.isFinite(x)))return;
 txWheelDraft=parts;
 document.getElementById('tx-wheel-overlay')?.remove();
 const overlay=document.createElement('div');overlay.className='tx-wheel-overlay';overlay.id='tx-wheel-overlay';
 overlay.innerHTML='<section class="tx-wheel-dialog" role="dialog" aria-modal="true" aria-label="日付を選択"><div class="tx-wheel-heading"><span>日付を選択</span><button type="button" onclick="closeTxDateWheel()">キャンセル</button></div><div class="tx-wheel-picker"><div class="tx-wheel-columns">'+['year','month','day'].map(t=>'<div class="tx-wheel-col" id="tx-wheel-'+t+'" role="listbox" aria-label="'+({year:'年',month:'月',day:'日'}[t])+'"></div>').join('')+'</div></div><button type="button" class="tx-wheel-confirm" onclick="confirmTxDateWheel()">この日付に決定</button></section>';
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeTxDateWheel()});
 document.body.appendChild(overlay);
 ['year','month','day'].forEach(type=>{
  txWheelFill(type);
  const col=document.getElementById('tx-wheel-'+type);
  let timer;
  col.addEventListener('scroll',()=>{
   txWheelSync(type);
   clearTimeout(timer);timer=setTimeout(()=>{const vals=txWheelOptions(type),pos={year:0,month:1,day:2}[type];col.scrollTo({top:Math.max(0,vals.indexOf(txWheelDraft[pos]))*44,behavior:'smooth'});},110);
  },{passive:true});
  col.addEventListener('click',e=>{
   const item=e.target.closest('.tx-wheel-item');if(!item)return;
   col.scrollTo({top:Math.max(0,txWheelOptions(type).indexOf(Number(item.dataset.value)))*44,behavior:'smooth'});
  });
 });
}
function closeTxDateWheel(){document.getElementById('tx-wheel-overlay')?.remove();txWheelDraft=null}
function confirmTxDateWheel(){
 if(!txWheelDraft)return;
 ['year','month','day'].forEach(txWheelSync);
 const input=document.getElementById('tx-date-value'),button=document.getElementById('tx-date-open');
 if(input&&button){
  const [y,m,d]=txWheelDraft;input.value=txWheelISO(txWheelDraft);
  button.textContent=y+'年'+m+'月'+d+'日';
 }
 closeTxDateWheel();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('tx-wheel-overlay'))closeTxDateWheel()});

render();
