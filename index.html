<!doctype html>
<html lang="ja"><head><meta name="takuwae-version" content="2.2.6"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: ./icon-wallet-b.png; connect-src 'self' https://qajwwulbrvdtbukxpvvy.supabase.co; base-uri 'self'; form-action 'none'">
<link rel="apple-touch-icon" sizes="512x512" href="./icon-wallet-b.png?v=20261120b"><link rel="icon" type="image/png" href="./icon-wallet-b.png?v=20261120b"><link rel="manifest" href="./manifest.webmanifest"><title>たくわえ</title>
<style>body{margin:0;background:#edf3f5;color:#17374c;font:16px/1.6 system-ui}main{max-width:700px;margin:auto;padding:16px}h1{font-size:1.4rem}label{display:block;margin:12px 0}input,button{font:inherit;min-height:44px;padding:8px 12px;border-radius:8px}input[type=email]{width:90%}button{border:0;background:#255f7b;color:white;margin:4px}button:disabled{opacity:.5}#status{padding:12px;background:white;border-radius:8px;white-space:pre-wrap}iframe{width:100%;height:85vh;border:0}.hidden{display:none}
#sync-settings-dialog{box-sizing:border-box;width:min(92vw,540px);max-height:85dvh;padding:16px;border:0;border-radius:16px;background:#edf3f5;color:#17374c}
#sync-settings-dialog::backdrop{background:rgb(0 0 0 / .45)}
#sync-settings-dialog h2{margin:0}
#sync-settings-dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px}
#sync-settings:not([open]) p{display:none}
#sync-settings summary[hidden]{display:none}
#sync-settings p:empty{display:none}
.ready{padding:0}
.ready>h1,.ready #import-panel,.ready #receive,.ready #trial,.ready #trial-status{display:none}
.ready #app{display:block;height:100dvh}
#startup{min-height:100dvh;display:grid;place-content:center;text-align:center;padding:16px;box-sizing:border-box}
#startup[hidden],#shell[hidden]{display:none}
</style><style>
@media (min-width: 760px) {
  main#shell.ready { max-width: none; }
}
</style>
</head>
<body><div id="startup" role="status">たくわえを開いています…</div><noscript>たくわえを開くにはJavaScriptを有効にしてください。</noscript><main id="shell" hidden><h1>たくわえ</h1>
<section id="login"><form id="login-form"><label>メールアドレス <input id="email" type="email" autocomplete="email" required></label><button id="send">認証メールを送る</button></form>
<form id="code-form">
<label>メールに届いた認証コード <input id="email-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" required></label>
<button id="verify-code">コードでログイン</button>
</form></section>
<div id="sync-settings-setup"><details id="sync-settings" open>
<button type="button" id="return-local" hidden>この端末の家計簿に戻る</button>
<summary id="sync-settings-label" hidden>同期の設定</summary>
<label><input id="remember" type="checkbox">この端末でログインを維持する</label>
<p id="status" role="status">メールでログインすると、このアカウントの同期状態を確認できます。</p>
<section id="controls" class="hidden"><label><input id="writes" type="checkbox">この端末の変更をクラウドへ同期する</label>
<button id="receive">この端末へ初回受信</button><button id="sync" disabled>今すぐ同期</button><button id="recover" disabled>保存済みの状態を再表示</button><button id="logout">ログアウト</button>
<button id="enable-offline">この端末でオフライン起動を有効にする</button><p id="offline-status" role="status"></p><button id="trial">架空データで通信を試験</button><p id="trial-status" role="status"></p></section>
</details></div>
<dialog id="sync-settings-dialog" aria-labelledby="sync-settings-title"><header><h2 id="sync-settings-title">同期の設定</h2><button id="sync-settings-close" type="button">閉じる</button></header></dialog>
<section id="conflict" class="hidden"><h2>変更が重なっています</h2><pre id="conflict-summary"></pre><button id="backup-conflict">双方のデータを退避</button><label>残す内容 <select id="conflict-choice"><option value="">選択してください</option><option value="local">この端末の内容</option><option value="remote">クラウドの内容</option></select></label><label><input id="backup-confirmed" type="checkbox">退避したファイルを保存し、残す内容を確認しました</label><button id="resolve-conflict">選んだ内容で解決</button></section>
<section id="import-panel" aria-labelledby="backup-heading">
<h2 id="backup-heading">初回移行の事前確認</h2>
<p>iPhoneの「たくわえ」から保存したJSONを選ぶと、取り込み予定の件数を確認できます。件数確認ではファイルを端末内で読み取ります。初回登録を確定するとクラウドへ送信します。</p>
<label>JSONバックアップ <input id="backup-preview-file" type="file" accept=".json,application/json"></label>
<p id="backup-preview-status" role="status"></p>
<div id="initial-import" class="hidden">
<label><input id="import-backup-confirmed" type="checkbox">元のJSONバックアップを別に保存しています</label>
<button id="prepare-import">端末内で登録を準備する</button>
<button id="send-import" disabled>クラウドへ初回登録する</button>
<p id="import-status" role="status"></p>
</div>
</section>
<iframe id="app" title="たくわえ同期版の本体" class="hidden"></iframe>
</main><script type="module" src="./supabase/start-ledger.js"></script></body></html>
